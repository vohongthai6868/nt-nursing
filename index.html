  function redactGivenName(s){
    var parts = String(s||"").trim().split(/\s+/);
    if(parts.length<=1) return parts[0]||"";
    return parts.slice(0,-1).join(" ");
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtDate(s){
    if(!s) return "—";
    var d = new Date(s);
    if(isNaN(d.getTime())) return esc(s);
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    return dd+"/"+mm+"/"+d.getFullYear();
  }
  function fmtDateTime(s){
    if(!s) return "—";
    var d = new Date(s);
    if(isNaN(d.getTime())) return esc(s);
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var hh = String(d.getHours()).padStart(2,"0");
    var mi = String(d.getMinutes()).padStart(2,"0");
    return dd+"/"+mm+"/"+d.getFullYear()+" "+hh+":"+mi;
  }
  function deptName(code){

    return d ? d.name : (EXTRA_DEPT_NAMES[code] || code || "—");

  function computeCoreAlerts(){
    var alerts = [];
    state.sops.forEach(function(s){
      if(s.status==="draft"){
        alerts.push({tone:"muted",text:"Dự thảo chờ rà soát/phê duyệt: "+s.code+" — "+s.name,tab:"sops",modalType:"sop",modalId:s.id});
      } else if(s.status==="under_review"){
        alerts.push({tone:"warn",text:"SOP đang rà soát: "+s.code+" — "+s.name,tab:"sops",modalType:"sop",modalId:s.id});
      } else if(s.status==="expired"||(s.status==="replaced" && !s.replacedBy)){
        /* SOP đã có bản thay (replacedBy) thì không cảnh báo nữa */
        alerts.push({tone:"danger",text:"SOP hết hiệu lực cần thay thế: "+s.code+" — "+s.name,tab:"sops",modalType:"sop",modalId:s.id});
      } else if(s.status==="effective" && isPast(s.reviewDate)){
        alerts.push({tone:"warn",text:"Quá hạn rà soát định kỳ: "+s.code+" — "+s.name,tab:"sops",modalType:"sop",modalId:s.id});
      }
    });
    state.checklists.forEach(function(c){
      if(typeof c.complianceRate==="number" && c.complianceRate<85){
        alerts.push({tone:"warn",text:"Tuân thủ thấp ("+c.complianceRate+"%): "+c.name,tab:"checklists",modalType:"checklist",modalId:c.id});
      }
    });
    state.incidents.forEach(function(i){
      if((i.severity==="nghiem_trong"||i.severity==="trung_binh") && i.status!=="da_dong"){
        alerts.push({tone:"danger",text:"Sự cố "+(SEVERITY[i.severity]?SEVERITY[i.severity].label.toLowerCase():i.severity)+" chưa đóng: "+i.title,tab:"incidents",modalType:"incident",modalId:i.id});
      }
      /* Sự cố thuộc diện báo cáo bắt buộc (ghi nhận từ phần mềm) còn thiếu bước báo cáo */
      if(i.reportType==="bat_buoc"){
        var pend = incEscalationPending(i);
        if(pend.length){
          alerts.push({tone:"danger",text:"Báo cáo bắt buộc chưa hoàn tất ("+pend.length+" bước): "+i.title+" — còn thiếu: "+pend.map(function(s){ return s.label.replace(/^Đã |^Bệnh viện đã /,""); }).join("; "),tab:"incidents",modalType:"incident",modalId:i.id});
        }
      }
    });
    var expiringStaff = state.staff.filter(function(s){ return s.competencyStatus!=="dat"; });
    if(expiringStaff.length){
      alerts.push({tone:"warn",text:expiringStaff.length+" nhân sự cần đánh giá/đánh giá lại năng lực",tab:"staff"});
    }
    state.trainings.forEach(function(t){
      var total = (t.enrollments||[]).length;
      var done = (t.enrollments||[]).filter(function(e){ return e.status==="da_hoan_thanh"; }).length;
      var pct = total ? Math.round(done/total*100) : 0;
      var tGroup = TRAINING_GROUP[t.category]||"training";
      if(total && pct<70 && tGroup!=="hidden"){
        alerts.push({tone:"warn",text:"Đào tạo hoàn thành thấp ("+pct+"%): "+t.title,tab:tGroup,modalType:"training",modalId:t.id});
      }
    });
    state.sodibuong.forEach(function(r){
      var pct = sdbOverallPct(r.sections);
      if(pct!==null && pct<80){
        alerts.push({tone:"warn",text:"Sổ đi buồng "+deptName(r.department)+" ("+fmtDate(r.roundDate)+"): chỉ đạt "+pct+"%",tab:"sodibuong",modalType:"sdb",modalId:r.id});
      }
      if(r.summary && r.summary.issue && !r.summary.resolved){
        alerts.push({tone:"danger",text:"Tồn tại chưa khắc phục ("+deptName(r.department)+"): "+r.summary.issue,tab:"sodibuong",modalType:"sdb",modalId:r.id});
      }
    });
    return alerts;
  }

        if(t.category==="de_an_cai_tien" && t.isRealRecord===false){
          alerts.push({tone:"muted",tab:"qiproject",modalType:"training",modalId:t.id,
            text:"Đề án cải tiến dự thảo chờ phê duyệt: "+(t.code||"")+" — "+t.title});
        }
        if((t.category==="tap_huan"||t.category==="dtlt") && !(t.enrollments||[]).length){ noEnroll.push(t.code||t.title); }
      });
      if(noEnroll.length){
        alerts.push({tone:"muted",tab:"plans",text:noEnroll.length+" hoạt động tập huấn/đào tạo liên tục chưa có danh sách ghi danh: "+listNames(noEnroll,4)});
      }
    }

    /* Họp định kỳ */
    if(state.loaded.hdnbMeetings){
      var have = {};
      state.hdnbMeetings.forEach(function(r){
        if(r.department==="pdd" && (r.meetingDate||"").slice(0,4)===String(curYear)){ have[parseInt((r.meetingDate||"").slice(5,7),10)] = true; }
      });
      var miss = [];
      for(var m=1;m<curMonth;m++){ if(!have[m]) miss.push(m); }
      if(miss.length){
        alerts.push({tone:"warn",tab:"meetings",text:"Họp Hội đồng người bệnh cấp viện: chưa có biên bản tháng "+miss.join(", ")+"/"+curYear});
      }
      var noHdnb = HDNB_DEPTS.filter(function(c){
        return c!=="pdd" && !state.hdnbMeetings.some(function(r){ return r.department===c && (r.meetingDate||"").slice(0,4)===String(curYear); });
      });
      if(noHdnb.length){
        alerts.push({tone:"warn",tab:"departments",text:noHdnb.length+" khoa chưa ghi nhận họp Hội đồng người bệnh cấp khoa năm "+curYear+": "+listNames(noHdnb.map(deptName),4)});
      }
    }
    if(state.loaded.hdtMeetings && !state.hdtMeetings.length){
      alerts.push({tone:"muted",tab:"meetings",text:"Chưa ghi nhận buổi họp Điều dưỡng trưởng (giao ban hằng tuần) nào"});
    }
    if(state.loaded.hdddMeetings && !state.hdddMeetings.some(function(r){ return (r.meetingDate||"").slice(0,4)===String(curYear); })){
      alerts.push({tone:"muted",tab:"meetings",text:"Chưa ghi nhận buổi họp Hội đồng Điều dưỡng năm "+curYear});
    }

    /* Sự cố đã đóng nhưng chưa phân tích nguyên nhân gốc / biện pháp phòng ngừa */
    if(state.loaded.incidents){
      var lightNoRca = 0;
      state.incidents.forEach(function(i){
        if(i.status!=="da_dong") return;
        var noRca = !i.rootCause && !(i.correctiveActions||[]).length;
        if(!noRca) return;
        if(i.severity==="nghiem_trong"||i.severity==="trung_binh"){
          alerts.push({tone:"warn",tab:"incidents",modalType:"incident",modalId:i.id,
            text:"Sự cố "+(SEVERITY[i.severity]?SEVERITY[i.severity].label.toLowerCase():i.severity)+" đã đóng nhưng chưa có phân tích nguyên nhân gốc/biện pháp phòng ngừa: "+i.title});
        } else { lightNoRca++; }
      });
      if(lightNoRca){
        alerts.push({tone:"muted",tab:"incidents",text:lightNoRca+" sự cố mức nhẹ/chưa gây hại đã đóng nhưng chưa ghi nguyên nhân và biện pháp phòng ngừa"});
      }
    }

    if(state.loaded.incidents){
      var noGrp = state.incidents.filter(function(i){ return incClassifyMissing(i).length; }).length;
      if(noGrp) alerts.push({tone:"muted",tab:"incidents",text:noGrp+" sự cố chưa phân loại đủ 03 tiêu chí: mức độ tổn thương, nhóm sự cố, nhóm nguyên nhân (Điều 7 Thông tư 43/2018/TT-BYT; Công văn 7738/SYT-NVY)"});
      var todayS = localDateStr(new Date());
      state.incidents.forEach(function(i){
        var due = incExpertDue(i);
        if(due && due < todayS) alerts.push({tone:"danger",tab:"incidents",modalType:"incident",modalId:i.id,text:"Quá hạn 60 ngày nhóm chuyên gia đề xuất giải pháp (hạn "+fmtDate(due)+"): "+i.title});
        var late = (i.actionPlan||[]).filter(function(a){ return !a.doneAt && a.due && a.due < todayS; }).length;
        if(late) alerts.push({tone:"warn",tab:"incidents",modalType:"incident",modalId:i.id,text:late+" giải pháp khắc phục quá hạn: "+i.title});
      });
    }
    if(state.loaded.soyteReports){
      var tS = localDateStr(new Date());
      soyteReportPeriods().forEach(function(pr){
        if(soyteSent(pr.id)) return;
        var left = daysBetween(tS, pr.due);
        if(left < 0) alerts.push({tone:"danger",tab:"incidents",modalType:"soyte-summary",modalId:pr.id,text:"Quá hạn gửi Sở Y tế "+(-left)+" ngày: "+pr.label+" (hạn "+fmtDate(pr.due)+")"});
        else if(left <= 10) alerts.push({tone:"warn",tab:"incidents",modalType:"soyte-summary",modalId:pr.id,text:"Sắp đến hạn gửi Sở Y tế ("+fmtDate(pr.due)+", còn "+left+" ngày): "+pr.label});
      });
    }

    /* Sổ đi buồng: khoa lâm sàng chưa có phiếu trong 30 ngày */
    if(state.loaded.sodibuong){
      var done = {};
      state.sodibuong.forEach(function(r){
        var t = new Date(r.roundDate||"").getTime();
        if(!isNaN(t) && t>=cutoff30){ done[r.department]=true; }
      });
      var noRound = LAM_SANG.filter(function(c){ return !done[c]; });
      if(noRound.length){
        alerts.push({tone:"warn",tab:"sodibuong",text:noRound.length+"/"+LAM_SANG.length+" khoa lâm sàng chưa có phiếu Sổ đi buồng trong 30 ngày qua: "+listNames(noRound.map(deptName),5)});
      }
    }

    /* SOP: thiếu ngày rà soát, căn cứ pháp lý, kiểm tra QTKT */
    if(state.loaded.sops){
      var noReview = state.sops.filter(function(s){ return s.status==="effective" && !s.reviewDate; });
      var noLegal = state.sops.filter(function(s){ return s.status!=="replaced" && s.status!=="archived" && !(s.legalBasis||[]).length; });
      var noCheck = state.sops.filter(function(s){ return s.category==="qtkt" && !(s.kiemTraQtkt && s.kiemTraQtkt.lastCheckedAt); });
      if(noReview.length) alerts.push({tone:"muted",tab:"sops",text:noReview.length+" SOP đang hiệu lực chưa có ngày rà soát định kỳ"});
      if(noLegal.length) alerts.push({tone:"muted",tab:"sops",text:noLegal.length+" SOP chưa xác định căn cứ pháp lý"});
      if(noCheck.length) alerts.push({tone:"muted",tab:"sops",text:noCheck.length+" quy trình kỹ thuật chưa có lần kiểm tra/giám sát nào được ghi nhận"});
    }

    /* Bảng kiểm chưa có lượt đánh giá */
    if(state.loaded.checklists){
      var noRes = state.checklists.filter(function(c){ return !(c.recentResults||[]).length; });
      if(noRes.length) alerts.push({tone:"muted",tab:"checklists",text:noRes.length+" bảng kiểm chưa có lượt đánh giá nào: "+listNames(noRes.map(function(c){ return c.code; }),4)});
    }

    /* Văn bản pháp lý cần xác minh / hết hiệu lực */
    if(state.loaded.legalDocs){
      var needVerify = state.legalDocs.filter(function(d){ return d.type==="legal" && d.status==="can_xac_minh"; });
      var expiredDocs = state.legalDocs.filter(function(d){ return d.type==="legal" && d.status==="het_hieu_luc"; });
      if(expiredDocs.length) alerts.push({tone:"danger",tab:"legaldocs",text:expiredDocs.length+" văn bản pháp lý hết hiệu lực cần thay thế: "+listNames(expiredDocs.map(function(d){ return d.number||d.name; }),4)});
      if(needVerify.length) alerts.push({tone:"warn",tab:"legaldocs",text:needVerify.length+" văn bản pháp lý cần xác minh hiệu lực: "+listNames(needVerify.map(function(d){ return d.number||d.name; }),4)});
    }

    /* Thiết bị, vật tư */
    if(state.loaded.equipment){
      if(!state.equipment.length){
        alerts.push({tone:"muted",tab:"departments",text:"Chưa nhập danh mục thiết bị, vật tư cho khoa nào"});
      }
      state.equipment.forEach(function(e){
        if(e.status==="hong") alerts.push({tone:"danger",tab:"departments",text:"Thiết bị hỏng/ngưng dùng ("+deptName(e.department)+"): "+e.name});
        else if(e.status==="baotri") alerts.push({tone:"warn",tab:"departments",text:"Thiết bị cần bảo trì ("+deptName(e.department)+"): "+e.name});
      });
    }

    /* Chỉ tiêu chất lượng và báo cáo hằng ngày */
    if(state.loaded.qualityResults && !state.qualityResults.some(function(r){ return String(r.year||"")===String(curYear); })){
      alerts.push({tone:"muted",tab:"chisopdd",text:"Chưa nhập kết quả chỉ tiêu chất lượng năm "+curYear});
    }
    if(state.loaded.giaoban && state.giaoban.length){
      var last = state.giaoban.reduce(function(a,r){ return (r.date||"")>a ? (r.date||"") : a; },"");
      var lt = new Date(last).getTime();
      if(!isNaN(lt) && now.getTime()-lt>7*86400000){
        alerts.push({tone:"muted",tab:"giaoban",text:"Báo cáo giao ban hằng ngày: lần nạp gần nhất ngày "+fmtDate(last)});
      }
    }
    return alerts;
  }

  function computeAlerts(){
    return computeCoreAlerts().concat(computeExtraAlerts());
  }

  /* ---------------------------------------------------------------- */
  /* TỔNG HỢP VĂN BẢN THEO NĂM                                          */
  /* ---------------------------------------------------------------- */

  function vbInYear(o,y){
    return String(o.period||"").indexOf(y)!==-1 || String(o.title||"").indexOf(y)!==-1 || String(o.sessionDate||"").slice(0,4)===y;
  }
  function vbYears(){
    var set = {"2026":true};
    state.plans.forEach(function(p){ var m=String((p.period||"")+" "+(p.title||"")).match(/20\d\d/g); (m||[]).forEach(function(x){ set[x]=true; }); });
    return Object.keys(set).filter(function(x){ return x>="2024" && x<="2027"; }).sort().reverse();
  }

  function buildVanBan(y){
    var G = {
      kh:{label:"Kế hoạch (năm, chuyên đề)",items:[]},
      kht:{label:"Kế hoạch tháng",items:[]},
      bc:{label:"Báo cáo",items:[]},
      da:{label:"Đề án",items:[]},
      bba:{label:"Bình bệnh án (BBA)",items:[]},
      cd:{label:"Báo cáo chuyên đề",items:[]},
      bb:{label:"Biên bản họp Hội đồng người bệnh",items:[]},
      dn:{label:"Đề nghị, tờ trình",items:[]},
      sc:{label:"Báo cáo sự cố y khoa",items:[]},
      khac:{label:"Tập huấn, sinh hoạt khoa học, khảo sát, thi đua",items:[]}
    };
    var order = ["kh","kht","bc","da","bba","cd","bb","dn","sc","khac"];

    state.plans.forEach(function(p){
      if(p.id==="plan-lichsu-chiso-2020-2026") return;
      if(!vbInYear(p,y)) return;
      var it = {title:p.title, ref:p.docNumber||"", date:p.issueDate||p.period||"", tab:(p.type==="report"?"reports":"plans"), modalType:"plan", modalId:p.id};
      if(p.type==="monthly") G.kht.items.push(it);
      else if(p.type==="strategic") G.da.items.push(it);
      else if(p.id==="plan-bba-2026" || /bình bệnh án/i.test(p.title||"")) G.bba.items.push(it);
      else if(p.type==="report" || /\/BC/.test(p.docNumber||"")) G.bc.items.push(it);
      else G.kh.items.push(it);
    });

    state.trainings.forEach(function(t){
      if(!vbInYear(t,y)) return;
      var grp = TRAINING_GROUP[t.category]||"training";
      var it = {title:t.title, ref:t.code||"", date:t.sessionDate||t.period||"", tab:(grp==="training"?"plans":grp), modalType:"training", modalId:t.id};
      if(t.category==="de_an_cai_tien") G.da.items.push(it);
      else if(t.category==="binh_benh_an") G.bba.items.push(it);
      else if(t.category==="bao_cao_chuyen_de") G.cd.items.push(it);
      else G.khac.items.push(it);
    });

    state.hdnbMeetings.forEach(function(r){
      if(String(r.meetingDate||"").slice(0,4)!==y) return;
      G.bb.items.push({title:"Họp Hội đồng người bệnh "+(r.department==="pdd"?"cấp viện":deptName(r.department)), ref:"", date:r.meetingDate, tab:"meetings", url:r.url});
    });

    state.deNghi.forEach(function(r){
      if(String(r.date||"").slice(0,4)!==y) return;
      G.dn.items.push({title:r.title, ref:r.ref||"", date:r.date, url:r.url});
    });

    state.incidents.forEach(function(i){
      if(String(i.reportedAt||"").slice(0,4)!==y) return;
      G.sc.items.push({title:i.title, ref:i.code||"", date:i.reportedAt, tab:"incidents", modalType:"incident", modalId:i.id});
    });

    var total = 0;
    order.forEach(function(k){
      G[k].items.sort(function(a,b){ return String(a.date||"").localeCompare(String(b.date||"")); });
      total += G[k].items.length;
    });
    return {groups:G, order:order, total:total};
  }

  var SOLT_TYPES = [
    {key:"kh", roman:"I", title:"Sổ lưu trữ kế hoạch", col:"Nội dung kế hoạch"},
    {key:"bc", roman:"II", title:"Sổ lưu trữ báo cáo", col:"Nội dung báo cáo"},
    {key:"bb", roman:"III", title:"Sổ lưu trữ biên bản", col:"Nội dung biên bản"},
    {key:"tt", roman:"IV", title:"Sổ lưu trữ tường trình", col:"Nội dung tường trình"},
    {key:"dn", roman:"V", title:"Sổ lưu trữ đề nghị", col:"Nội dung đề nghị"}
  ];
  var SOLT_PDF = "tai-lieu/so-luu-tru/So-luu-tru-cong-van-PDD_2026-10-28.pdf";
  function soltYears(){
    var ys = {};
    state.soLuuTru.forEach(function(r){ var y = String(r.ngay||"").slice(0,4); if(y) ys[y] = true; });
    return Object.keys(ys).sort().reverse();
  }
  function soltRefAction(ref){
    var p = String(ref||"").split("/");
    if(p[0]==="plans" && p[1]) return ' data-action="open-plan" data-id="'+esc(p[1])+'"';
    if(p[0]==="trainings" && p[1]) return ' data-action="open-training" data-id="'+esc(p[1])+'"';
    return "";
  }
  function renderSoLuuTru(){
    var canWrite = state.dbAvailable && state.me.canEdit===true;

      if(y!=="all" && String(r.ngay||"").slice(0,4)!==y) return false;
      if(q && (String(r.so||"")+" "+String(r.noiDung||"")+" "+String(r.ghiChu||"")).toLowerCase().indexOf(q)===-1) return false;

    });

      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      '<a class="btn sm" href="'+SOLT_PDF+'" target="_blank" rel="noopener">'+ICONS.report+'<span>Bản in PDF (28/10/2026)</span></a>'+
      (canWrite?'<button class="btn sm primary" data-action="open-solt" data-loai="kh">'+ICONS.plus+'<span>Thêm văn bản</span></button>':'')+
      '</div></div>';
    html += '<div class="kpis">';
    var tones = {kh:"info",bc:"ok",bb:"violet",tt:"warn",dn:"info"};
    SOLT_TYPES.forEach(function(t){
      html += kpiTile(t.title.replace("Sổ lưu trữ ",""), tones[t.key], String(all.filter(function(r){ return r.loai===t.key; }).length), "văn bản");
    });
    html += kpiTile("Cần xác minh","warn",String(nCxm),"số hiệu hoặc ngày");
    html += '</div>';
    html += '<div class="filters"><select data-filter="soltYear"><option value="all">Tất cả các năm</option>'+
      soltYears().map(function(x){ return '<option value="'+x+'"'+(x===y?" selected":"")+'>Năm '+x+'</option>'; }).join("")+'</select>'+
      '<input type="search" data-filter="soltQ" value="'+esc(state.filters.soltQ||"")+'" placeholder="Tìm số, nội dung…" style="flex:1;min-width:160px"/></div>';
    SOLT_TYPES.forEach(function(t){
      var list = rows.filter(function(r){ return r.loai===t.key; }).sort(function(a,b){ return String(a.ngay||"").localeCompare(String(b.ngay||"")) || String(a.so||"").localeCompare(String(b.so||"")); });
      html += '<div class="section"><h3>'+t.roman+'. '+esc(t.title)+' ('+list.length+')</h3>';
      if(canWrite) html += '<div style="margin-bottom:8px"><button class="btn sm" data-action="open-solt" data-loai="'+t.key+'">'+ICONS.plus+'<span>Thêm vào '+esc(t.title.toLowerCase())+'</span></button></div>';
      if(!list.length){ html += '<div class="empty">Chưa có văn bản'+(q||y!=="all"?" phù hợp bộ lọc":"")+'.</div></div>'; return; }
      html += '<div class="tablewrap"><table><thead><tr><th>STT</th><th>Số ban hành</th><th>'+esc(t.col)+'</th><th>Ngày ban hành</th>'+(canWrite?'<th></th>':'')+'</tr></thead><tbody>';
      list.forEach(function(r,i){
        var act = soltRefAction(r.ref);
        var title = r.url ? '<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.noiDung||"—")+'</a>' : esc(r.noiDung||"—");
        var cxm = /cần xác minh/i.test(r.ghiChu||"");
        html += '<tr><td class="num">'+(i+1)+'</td><td class="num" style="white-space:normal;min-width:110px">'+esc(r.so||"—")+'</td>'+
          '<td style="white-space:normal;min-width:240px">'+title+
          (r.ghiChu?'<div class="hint">'+(cxm?badge("warn","Cần xác minh")+' ':'')+esc(r.ghiChu)+'</div>':'')+
          (act?'<div><button class="btn sm" style="margin-top:4px"'+act+'>Xem bản ghi</button></div>':'')+'</td>'+
          '<td style="white-space:normal">'+esc(r.ngayText||fmtDate(r.ngay))+'</td>'+
          (canWrite?'<td><button class="btn sm" data-action="open-solt" data-id="'+esc(r.id)+'">Sửa</button></td>':'')+'</tr>';
      });
      html += '</tbody></table></div></div>';
    });
    html += '<div class="footnote">Dữ liệu lấy từ kế hoạch, báo cáo, biên bản họp, danh mục đề nghị đã có trong phần mềm (tổng hợp 28/10/2026). “Không ghi số”: bản gốc không có số ký hiệu; “…/KH-…”: số còn để trống. Mục “Cần xác minh” đối chiếu với bản ký lưu tại Phòng. Không ghi thông tin định danh người bệnh, kể cả ở phần tường trình.</div>';
    return html;
  }
  function soltModalHtml(id, loai){
    var r = id ? state.soLuuTru.filter(function(x){ return x.id===id; })[0] : null;
    r = r || {loai:loai||"kh"};
    var body = '<div class="field"><label>Phần sổ</label><select id="f-solt-loai">'+SOLT_TYPES.map(function(t){ return '<option value="'+t.key+'"'+(r.loai===t.key?" selected":"")+'>'+t.roman+'. '+esc(t.title)+'</option>'; }).join("")+'</select></div>';

    body += '<div class="field"><label>Ngày ban hành</label><input type="date" id="f-solt-ngay" value="'+esc(/^\d{4}-\d{2}-\d{2}$/.test(r.ngay||"")?r.ngay:"")+'"/></div></div>';
    body += '<div class="field"><label>Nội dung</label><textarea id="f-solt-nd" placeholder="Trích yếu nội dung văn bản">'+esc(r.noiDung||"")+'</textarea></div>';
    body += '<div class="field"><label>Ngày hiển thị (nếu không rõ ngày cụ thể)</label><input type="text" id="f-solt-ngaytext" value="'+esc(r.ngayText||"")+'" placeholder="VD: Tháng 10/2026; để trống thì lấy ngày ban hành"/></div>';

  function nextMonthPeriod(period){
    var m = /^(\d{4})-(\d{2})$/.exec(period||"");
    if(!m) return null;
    var y = parseInt(m[1],10), mo = parseInt(m[2],10);
    mo += 1;
    if(mo>12){ mo=1; y+=1; }
    return y+"-"+(mo<10?"0"+mo:mo);
  }
  function computePlanAlerts(){
    var alerts = [];
    var monthly = state.plans.filter(function(p){ return p.type==="monthly" && p.period; });
    var byPeriod = {};
    var curPeriod = localDateStr(new Date()).slice(0,7);
    monthly.forEach(function(p){ byPeriod[p.period]=p; });
    monthly.forEach(function(p){
      var np = nextMonthPeriod(p.period);
      /* chỉ cảnh báo khi tháng kế tiếp đã đến (hoặc đã qua) mà vẫn chưa có kế hoạch */
      if(np && np<=curPeriod && !byPeriod[np]){
        alerts.push({tone:"warn",text:"Kế hoạch tháng "+p.period+" chưa có báo cáo kết quả xác nhận (kế hoạch tháng "+np+" chưa được tạo)",tab:"plans",modalType:"plan",modalId:p.id});
      }
    });
    if(state.loaded.plans){
      var phuongHuong = state.plans.filter(function(p){ return p.contentAvailable===false; });
      phuongHuong.forEach(function(p){
        alerts.push({tone:"muted",text:"Kế hoạch/báo cáo chưa số hóa được nội dung chi tiết: "+p.title,tab:"plans",modalType:"plan",modalId:p.id});
      });
    }
    return alerts;
  }

  /* Mọi khung có tiêu đề (h3) đều thu gọn mặc định; bấm tiêu đề để mở, trạng thái lưu trên trình duyệt */
  function autoCollapseSections(root){
    var st = loadAlertCollapsed();
    var secs = root.querySelectorAll(".section");
    for(var i=0;i<secs.length;i++){
      var sec = secs[i], h = sec.firstElementChild;
      if(!h || h.tagName!=="H3") continue;
      var key = "auto-"+state.activeTab+"-"+h.textContent.replace(/\s+/g," ").trim();
      var isCollapsed = st[key]!==false;
      var btn = document.createElement("button");
      btn.className = "alertgroup-toggle";
      btn.setAttribute("data-action","toggle-alertgroup");
      btn.setAttribute("data-group", key);
      btn.setAttribute("aria-expanded", isCollapsed?"false":"true");
      if(!isCollapsed) btn.style.marginBottom = "8px";
      btn.innerHTML = '<span class="chev" style="transform:rotate('+(isCollapsed?"0":"90")+'deg)">'+ICONS.chevron+'</span>';
      sec.insertBefore(btn, h);
      h.style.margin = "0";
      btn.appendChild(h);
      if(isCollapsed){
        for(var c=btn.nextElementSibling; c; c=c.nextElementSibling){ c.style.display = "none"; }
      }
    }
    /* Bảng con có tiêu đề in đậm ngay phía trên (VD thống kê sự cố theo khoa, mức độ, tháng): cũng thu gọn mặc định */
    var heads = root.querySelectorAll("div[style*='font-weight:700']");
    for(var j=0;j<heads.length;j++){
      var hd = heads[j], tb = hd.nextElementSibling;
      if(!tb || !tb.classList.contains("tablewrap") || hd.querySelector("button,a")) continue;
      var k2 = "auto-"+state.activeTab+"-sub-"+hd.textContent.replace(/\s+/g," ").trim();
      var col2 = st[k2]!==false;
      var b2 = document.createElement("button");
      b2.className = "alertgroup-toggle";
      b2.setAttribute("data-action","toggle-alertgroup");
      b2.setAttribute("data-group", k2);
      b2.setAttribute("aria-expanded", col2?"false":"true");
      b2.style.cssText = "font-weight:700;font-size:12.3px;color:var(--text);margin:"+(j?"8px":"0")+" 0 4px";
      b2.innerHTML = '<span class="chev" style="transform:rotate('+(col2?"0":"90")+'deg)">'+ICONS.chevron+'</span>';
      var span = document.createElement("span"); span.textContent = hd.textContent; b2.appendChild(span);
      hd.parentNode.replaceChild(b2, hd);
      if(col2) tb.style.display = "none";
    }
  }

  function renderStaff(){
    var f = state.filters.staff;
    var html = '<div class="pagehead"><div><h2>Nhân sự điều dưỡng</h2><p>'+state.staff.length+' nhân sự đang hoạt động</p></div>'+
      '<button class="btn primary" data-action="open-add-staff">'+ICONS.plus+'Thêm nhân sự</button></div>';
    html += '<div class="filters">';
    html += '<select data-filter="staffDept">'+optHtml(deptList(),f.dept)+'</select>';
    html += '<select data-filter="staffComp"><option value="all"'+(f.competency==="all"?" selected":"")+'>Tất cả năng lực</option>'+
      Object.keys(COMPETENCY).map(function(k){ return '<option value="'+k+'"'+(f.competency===k?" selected":"")+'>'+esc(COMPETENCY[k].label)+'</option>'; }).join("")+
      '</select>';
    html += '</div>';

    var rows = state.staff.filter(function(s){
      if(f.dept!=="all" && s.department!==f.dept) return false;
      if(f.competency!=="all" && s.competencyStatus!==f.competency) return false;
      return true;
    }).sort(function(a,b){ return (a.department+a.name).localeCompare(b.department+b.name); });


    html += '<div class="tablewrap"><table><thead><tr><th>Mã</th><th>Họ tên</th><th>Chức danh</th><th>Khoa</th><th>Vào làm</th><th>Năng lực</th><th>Hạn đánh giá lại</th><th>Đào tạo liên tục</th><th>SĐT</th></tr></thead><tbody>';
    rows.forEach(function(s){
      var c = COMPETENCY[s.competencyStatus]||{label:s.competencyStatus,tone:"muted"};
      var cne = cneSummaryFor(s.id);
      html += '<tr id="staff-'+esc(s.id)+'"><td class="num">'+esc(s.code)+'</td><td><b>'+esc(s.name)+'</b></td><td>'+esc(s.title)+'</td><td>'+esc(deptName(s.department))+'</td>'+
        '<td>'+fmtDate(s.startDate)+'</td><td>'+badge(c.tone,c.label)+'</td><td>'+fmtDate(s.nextReviewDate)+'</td>'+
        '<td>'+(cne.count? cne.count+" khóa" : '<span class="hint">Chưa ghi nhận</span>')+'</td>'+
        '<td class="num">'+esc(s.phone||"—")+'</td></tr>';
    });
    if(!rows.length){ html += '<tr><td colspan="9" class="empty">Không có nhân sự phù hợp.</td></tr>'; }

  function saveStaff(){
    if(!db) return;
    var name = document.getElementById("f-staff-name").value.trim();
    var code = document.getElementById("f-staff-code").value.trim();
    var title = document.getElementById("f-staff-title").value;
    var dept = document.getElementById("f-staff-dept").value;
    var start = document.getElementById("f-staff-start").value || null;
    var phone = document.getElementById("f-staff-phone").value.trim() || null;
    if(!name || !code){ showToast("Vui lòng nhập họ tên và mã nhân sự",true); return; }
    db.collection("staff").add({
      code:code,name:name,title:title,department:dept,phone:phone,startDate:start,
      competencyStatus:"chua_danh_gia",nextReviewDate:null,status:"active"
    }).then(function(){
      showToast("Đã thêm nhân sự "+name);
      state.modal=null; render();
    }).catch(function(e){ showToast("Lỗi: "+(e&&e.message||e),true); });
  }

        legalList.forEach(function(l,idx){
          var lm = LEGAL_STATUS[l.status]||{label:l.status||"—",tone:"muted"};

  function renderReferenceDocsOnlySection(scope, allRef){
    var meta = SCOPE_META[scope];
    var refList = allRef.filter(function(d){ return (d.scope||"external")===scope; });
    var hdr = collapsibleHeader("refdocs-"+scope, esc(meta.label)+' ('+refList.length+')');

        html += '<div class="empty">Chưa có tài liệu tham khảo nào.</div>';
      } else {
        html += '<div class="timeline">'+refList.map(function(r,idx){
          var titleHtml = r.url ? '<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.name||"—")+'</a>' : esc(r.name||"—");

    var meta = SCOPE_META[scope];
    var html = '<div style="margin-bottom:10px"><div style="font-weight:700;font-size:12.3px;margin-bottom:4px">'+esc(meta.label)+'</div>';
    html += '<ol style="margin:0;padding-left:20px;font-size:12.3px;line-height:1.7">';

    });
    html += '</ol></div>';
    return html;
  }

  function renderLegalDocs(){
    var allLegal = state.legalDocs.filter(function(d){ return d.type==="legal"; }).sort(function(a,b){ return (a.number||"").localeCompare(b.number||""); });
    var html = '<div class="pagehead"><div><h2>Văn bản pháp lý</h2><p>'+allLegal.length+' văn bản pháp lý</p></div></div>';

      renderLegalTOCOnly("external", allLegal)+

    html += renderLegalDocsOnlySection("internal", allLegal);

  function renderReferenceDocs(){
    var allRef = state.legalDocs.filter(function(d){ return d.type==="reference"; }).sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
    var html = '<div class="pagehead"><div><h2>Tài liệu tham khảo</h2><p>'+allRef.length+' tài liệu tham khảo</p></div></div>';

    html += renderReferenceDocsOnlySection("internal", allRef);
    return html;

uuDo_v01_20261026.docx"}, {"f": "01", "k": "Phòng Điều dưỡng và tài liệu dùng chung", "t": "Bài 2: Các mô hình phân công chăm sóc (theo nhiệm vụ, theo nhóm, toàn diện)", "n": "Tài liệu đào tạo", "g": "Sách “Quản lý Điều dưỡng trưởng khoa 2026”, Bộ Y tế, NXB Y học (Thư viện BV), Bài 2, tr. 22–27. Số hoá 31/10/2026: chép nguyên văn, vẽ lại 3 sơ đồ; phụ lục so sánh 3 mô hình và liên hệ C6.3.", "o": false, "p": "tai-lieu/thu-vien-2026/01-Phong-Dieu-duong-va-dung-chung/NhatTan_Bai2-Mo-hinh-phan-cong-cham-soc_v01_20261031.pdf", "file": "NhatTan_Bai2-Mo-hinh-phan-cong-cham-soc_v01_20261031.docx"}, {"f": "01", "k": "Phòng Điều dưỡng và tài liệu dùng chung", "t": "Hướng dẫn áp dụng mô hình phân công chăm sóc tại các khoa, bộ phận", "n": "Quản lý và an toàn người bệnh", "g": "[Dự thảo v05, 31/10/2026] Số NB và ĐD thực tế 12/13 khoa: toàn diện ở Phụ Sản, Nội TH, HSTC, Ngoại TQ, Ngoại CT; theo nhóm ở Nội TQ (80 NB), Nhi (78 NB), Truyền Nhiễm (20 NB, 2 ĐD hành chánh); YHCT-PHCN (~250 kỹ thuật/ngày) theo nhóm kỹ thuật + người phụ trách liệu trình; Thận nhân tạo (27 máy, ~57 lượt/ngày, 10 ĐD) toàn diện theo cụm máy, ~5–6 NB/ĐD/ca. Gắn phiếu ISBAR BM-C6.1-04, mẫu BM-PCCS-01, BK-PCCS-01. Cần Hội đồng Điều dưỡng thống nhất.", "o": false, "p": "tai-lieu/thu-vien-2026/01-Phong-Dieu-duong-va-dung-chung/NhatTan_Huong-dan-ap-dung-mo-hinh-phan-cong-cham-soc-cac-khoa_v05_20261031.pdf", "file": "NhatTan_Huong-dan-ap-dung-mo-hinh-phan-cong-cham-soc-cac-khoa_v05_20261031.docx"}, {"f": "01", "k": "Phòng Điều dưỡng và tài liệu dùng chung", "t": "Sách “Quản lý Điều dưỡng trưởng khoa 2026” (Bộ Y tế, NXB Y học) – mục lục 21 bài", "n": "Tài liệu đào tạo", "g": "Khung để số hoá dần các bài; cột trạng thái ghi bài đã số hoá (Bài 2) và liên hệ phần mềm. Sách lưu tại Thư viện BV. Chủ biên, ISBN: chưa có thông tin; tiêu đề Bài 11 bị mờ, Cần xác minh.", "o": false, "p": "tai-lieu/thu-vien-2026/01-Phong-Dieu-duong-va-dung-chung/NhatTan_Sach-Quan-ly-DDT-khoa-2026_Muc-luc-21-bai_20261031.pdf", "file": "NhatTan_Sach-Quan-ly-DDT-khoa-2026_Muc-luc-21-bai_20261031.docx"}, {"f": "01", "k": "Phòng Điều dưỡng và tài liệu dùng chung", "t": "Phiếu bàn giao người bệnh giữa các ca trực theo ISBAR (BM-C6.1-04)", "n": "Quản lý và an toàn người bệnh", "g": "[Dự thảo 31/10/2026] Biểu mẫu ghi khi giao ca, kèm SOP-C6.1-02: số liệu NB đầu ca, bảng ISBAR từng NB, bàn giao thuốc GN-HT/thiết bị/hồ sơ, kiểm tra cuối bàn giao, ký 3 bên; trang hướng dẫn có ví dụ và thẻ bỏ túi ISBAR. Giám sát bằng BM-C6.1-01.", "o": false, "p": "tai-lieu/ho-so-C6.1/07_BM-C6.1-04_Phieu_ban_giao_ISBAR.pdf", "file": "NhatTan_BM-C6.1-04_Phieu-ban-giao-ISBAR_v01_20261031.docx"}, {"f": "01", "k": "Phòng Điều dưỡng và tài liệu dùng chung", "t": "Quy trình bàn giao nhanh bệnh nặng theo cấu trúc SBAR (60 giây) – tài liệu tham khảo", "n": "Tài liệu đào tạo", "g": "[Tham khảo bên ngoài, nhận 14/11/2026] Bài giảng 46 trang của BS Bạch Văn Cam và Điều dưỡng HSCC, Bệnh viện Nhi Đồng 1 (TP.HCM): đại cương bàn giao, cấu trúc SBAR, các bước SBAR nhanh 60 giây (S 10s – B 15s – A 20s – R 15s), so sánh với bàn giao ca trực 3 phút, bảng kiểm, mẫu thẻ nhựa, 7 kịch bản nhi khoa (phản vệ, suy hô hấp, sốt co giật, mất nước, SXH Dengue, nhiễm trùng, hạ đường huyết). Liên hệ C6.1, dùng song song phiếu ISBAR BM-C6.1-04 (bàn giao ca). Giữ nguyên bản gốc; không phải tài liệu ban hành của BV Nhật Tân.", "o": false, "p": "tai-lieu/thu-vien-2026/01-Phong-Dieu-duong-va-dung-chung/Tham-khao/TK_BV-Nhi-Dong-1_Ban-giao-nhanh-benh-nang-SBAR-60-giay_2026.pdf", "file": "SBAR NHANH PICTURE 2026.pdf"}, {"f": "01", "k": "Phòng Điều dưỡng và tài liệu dùng chung", "o": false, "t": "Quy trình bàn giao nhanh người bệnh nặng trong 60 giây theo SBAR (SOP-C6.1-03)", "n": "Quản lý và an toàn người bệnh", "g": "[Đã duyệt 14/11/2026, chờ Giám đốc ký ban hành] Dùng song song với ISBAR (SOP-C6.1-02, bàn giao ca): báo BS khi NB diễn tiến nặng, báo động đỏ, chuyển khoa cấp cứu, chuyển tuyến, báo giá trị XN báo động. 6 bước, S 10 – B 15 – A 20 – R 15 giây, nhắc lại y   function renderThuVien2026(){
    var all = THUVIEN2026;
    var cur = all.filter(function(d){ return !d.o; }).length;
    var html = '<div class="pagehead"><div><h2>Thư viện tài liệu 2026</h2><p>'+all.length+' tài liệu theo danh mục 15 thư mục ('+cur+' bản hiện hành, '+(all.length-cur)+' phiên bản trước). Bản Word gốc lưu trên ổ dự án và Drive Phòng; tại đây mở bản PDF. Các bản quy trình là dự thảo, cần thẩm định trước khi ban hành.</p></div></div>';
    var byF = {}, order = [];
    all.forEach(function(d){ if(!byF[d.f]){ byF[d.f]=[]; order.push(d.f); } byF[d.f].push(d); });
    order.sort().forEach(function(f){
      var list = byF[f];
      var hdr = collapsibleHeader("thuvien2026-"+f, esc(f+" · "+list[0].k)+' ('+list.length+')');
      html += '<div class="section" style="margin-bottom:22px">'+hdr.headerHtml;
      if(!hdr.isCollapsed){
        html += '<div class="timeline">';
        list.slice().sort(function(a,b){ return (a.o?1:0)-(b.o?1:0) || a.t.localeCompare(b.t); }).forEach(function(d){
          var titleHtml = d.p ? '<a href="'+esc(d.p)+'" target="_blank" rel="noopener">'+esc(d.t)+'</a>' : esc(d.t);
          html += '<div class="ev" style="border-left-color:var(--'+(d.o?'muted':'neutral-dark')+')"><b>'+titleHtml+'</b> '+
            badge(THUVIEN_NHOM_TONE[d.n]||"muted", d.n)+
            (d.g?'<div class="when">'+esc(d.g)+'</div>':"")+
            '<div class="when" style="opacity:.75">Tệp gốc: '+esc(d.file)+'</div>'+
            '</div>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    return html;
  }

  function renderKhac(){
    var all = state.khac.slice().sort(function(a,b){ return (a.category||"").localeCompare(b.category||"") || (a.title||"").localeCompare(b.title||""); });
    var html = '<div class="pagehead"><div><h2>Khác</h2><p>'+all.length+' tài liệu — các loại giấy tờ, hồ sơ nội bộ thật của Phòng Điều dưỡng chưa thuộc nhóm nào ở trên (lịch trực, đơn từ nhân sự, nội dung thực hành cho nhân viên mới...)</p></div></div>';
    if(!all.length){ html += '<div class="empty">Chưa có tài liệu nào.</div>'; return html; }
    var byCat = {};
    all.forEach(function(d){ var c=d.category||"Khác"; (byCat[c]=byCat[c]||[]).push(d); });
    Object.keys(byCat).sort().forEach(function(cat){
      var hdr = collapsibleHeader("khac-"+cat, esc(cat)+' ('+byCat[cat].length+')');
      html += '<div class="section" style="margin-bottom:22px">'+hdr.headerHtml;
      if(!hdr.isCollapsed){
        html += '<div class="timeline">';

          var titleHtml = d.url ? '<a href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.title||"—")+'</a>' : esc(d.title||"—");
          html += '<div class="ev" style="border-left-color:var(--neutral-dark)"><b>'+titleHtml+'</b>'+

            (d.note?'<div class="when">'+esc(d.note)+'</div>':"")+

        });
        html += '</div>';
      }
      html += '</div>';
    });
    return html;
  }

Phòng ngừa té ngã","y":"2024","a":"Thư Huỳnh Mỹ, Thành Lâm Ngọc Minh, Huyền Nguyễn Ngọc, và cs. · Tạp chí Y học Cộng đồng","t":"KHẢO SÁT KIẾN THỨC, THÁI ĐỘ, HÀNH VI CỦA ĐIỀU DƯỠNG VỀ PHÒNG NGỪA TÉ NGÃ CHO NGƯỜI BỆNH CÁC KHOA NỘI TRÚ","u":"https://doi.org/10.52163/yhc.v65icd12.1823","n":"Khảo sát 269 điều dưỡng nội trú BV TP Thủ Đức (2024): chỉ 19% kiến thức đúng, 38,3% thái độ tích cực, 86,6% hành vi tốt. Điều dưỡng được đào tạo có thái độ tích cực gấp 2 lần và hành vi tốt gấp 2,9 lần. (Việt Nam; Mở, PDF lưu ở thư mục dự án nckh-web)"},{"g":"06","k":"01 · Phòng ngừa té ngã","y":"2021","a":"Thị Minh Thái Hoàng, Thị Thu Hằng Đinh, Thị Bích Ngọc Phạm, và cs. · Tạp chí Y học Việt Nam","t":"KIẾN THỨC CỦA ĐIỀU DƯỠNG VỀ PHÒNG NGỪA TÉ NGÃ CHO NGƯỜI BỆNH TẠI BỆNH VIỆN ĐA KHOA TỈNH NAM ĐỊNH NĂM 2020","u":"https://doi.org/10.51298/vmj.v500i2.349","n":"Cắt ngang 170 điều dưỡng BVĐK tỉnh Nam Định: 56,5% kiến thức phòng ngừa té ngã đạt; 34,7% chưa từng dự lớp đào tạo về té ngã. Khuyến nghị đào tạo bắt buộc. (Việt Nam; Mở, PDF lưu ở thư mục dự án nckh-web)"},{"g":"06","k":"01 · Phòng ngừa té ngã","y":"2025","a":"Hiền Bùi Thị, Dương Nguyễn Văn, Thanh Trần Thu, và cs. · Tạp chí Y học Cộng đồng","t":"THỰC TRẠNG KIẾN THỨC VÀ THỰC HÀNH CỦA ĐIỀU DƯỠNG VÀ HỘ SINH VỀ PHÒNG NGỪA TÉ NGÃ CHO NGƯỜI BỆNH TẠI BỆNH VIỆN ĐA KHOA HÙNG VƯƠNG NĂM 2024","u":"https://doi.org/10.52163/yhc.v66icd10.2633","n":"160 điều dưỡng, hộ sinh: 49,4% kiến thức đạt, 87,5% thực hành đạt. Kiến thức liên quan loại hình đào tạo, khoa công tác, hình thức cập nhật; thực hành liên quan số người bệnh chăm sóc/ngày. (Việt Nam; Mở, PDF lưu ở thư mục dự án nckh-web)"},{"g":"06","k":"01 · Phòng ngừa té ngã","y":"2024","a":"Thân Thị Quỳnh Như, Bùi Hồng Thiên Khanh, Trần Ngọc Thanh Trúc, và cs. · Tạp chí Y học Việt Nam","t":"KIẾN THỨC VÀ THỰC HÀNH PHÒNG NGỪA TÉ NGÃ CỦA ĐIỀU DƯỠNG TRÊN NGƯỜI BỆNH CAO TUỔI","u":"https://doi.org/10.51298/vmj.v543i3.11555","n":"Điều dưỡng chăm sóc người bệnh cao tuổi: 98,7% kiến thức đạt, 88,1% thực hành đạt; kiến thức và thực hành tương quan thuận, liên quan nhu cầu cập nhật kiến thức. (Việt Nam; Mở, PDF lưu ở thư mục dự án nckh-web)"},{"g":"06","k":"01 · Phòng ngừa té ngã","y":"2022","a":"Morris ME, Webster K, Jones C, et al. · Age and ageing","t":"Interventions to reduce falls in hospitals: a systematic review and meta-analysis","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9078046/","n":"Tổng quan hệ thống, phân tích gộp 43 nghiên cứu can thiệp giảm té ngã trong bệnh viện: chỉ giáo dục (người bệnh và nhân viên) giảm có ý nghĩa tỷ suất té ngã (RaR 0,70). Căn cứ tốt cho chương trình GDSK phòng té ngã. (Quốc tế; Mở, PDF lưu ở thư mục dự án nckh-web; Giấy phép CC BY)"},{"g":"06","k":"01 · Phòng ngừa té ngã","y":"2022","a":"Schoberer D, Breimaier HE, Zuschnegg J, et al. · Worldviews on evidence-based nursing","t":"Fall prevention in hospitals and nursing homes: Clinical practice guideline","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9310602/","n":"Hướng dẫn thực hành lâm sàng dựa trên 79 RCT: khuyến cáo mạnh can thiệp đa yếu tố, tập luyện có giám sát, giáo dục và tư vấn; không khuyến cáo một công cụ đánh giá nguy cơ cụ thể hay giường thấp trong bệnh viện. (Quốc tế; Mở, PDF lưu ở thư mục dự án nckh-web; Giấy phép CC BY-NC)"},{"g":"06","k":"01 · Phòng ngừa té ngã","y":"2024","a":"McKercher JP, Peiris CL, Hill AM, et al. · Age and ageing","t":"Hospital falls clinical practice guidelines: a global analysis and systematic review","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11255989/","n":"Phân tích 20 hướng dẫn phòng té ngã bệnh viện toàn cầu: không còn khuyến cáo thang điểm sàng lọc nguy cơ; nên đánh giá toàn diện ở người cao tuổi, suy yếu; can thiệp đơn hoặc đa yếu tố đều được khuyến cáo. (Quốc tế; Mở, PDF lưu ở thư mục dự án nckh-web; Giấy phép CC BY)"},{"g":"06","k":"01 · Phòng ngừa té ngã","y":"2022","a":"Dabkowski E, Cooper S, Duncan JR, et al. · Healthcare (Basel, Switzerland)","t":"Adult Inpatients' Perceptions of Their Fall Risk: A Scoping Review","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9222288/","n":"Tổng quan phạm vi về nhận thức của người bệnh nội trú với nguy cơ té ngã của chính họ: người bệnh thường đánh giá thấp nguy cơ và ít gọi hỗ trợ; cần đưa quan điểm người bệnh vào chương trình phòng té ngã. (Quốc tế; Mở, PDF lưu ở thư mục dự án nckh-web; Giấy phép CC BY)"},{"g":"06","k":"01 · Phòng ngừa té ngã","y":"2024","a":"Nguyen LT, To KG, Tang TC, et al. · Risk management and healthcare policy","t":"Risk Factors and Profiles of Falls Among Inpatients in Vietnam: A Multicenter Nested Case-Control Study","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11416768/","n":"Bệnh chứng lồng ghép đa trung tâm tại Việt Nam (101 ca té ngã/404 chứng): yếu tố nguy cơ gồm giảm sức cơ, vận động, tiểu đêm, nhiều bệnh, dùng dụng cụ hỗ trợ đi lại, thiết bị y tế, thuốc chống động kinh; 19,8% té ngã xảy ra trong 24 giờ đầu nhập viện. (Quốc tế; Mở, PDF lưu ở thư mục dự án nckh-web; Giấy phép CC BY-NC)"},{"g":"06","k":"02 · Loét tỳ đè","y":"2024","a":"Nguyễn Thị Thúy Liễu, Nguyễn Hiếu Thảo, Lê Minh Kỷ · Tạp chí Y học Việt Nam","t":"KIẾN THỨC VỀ PHÒNG NGỪA LOÉT DO TỲ ĐÈ CỦA ĐIỀU DƯỠNG TẠI BỆNH VIỆN ĐA KHOA TRUNG TÂM TIỀN GIANG","u":"https://doi.org/10.51298/vmj.v539i1.9714","n":"BVĐK Trung tâm Tiền Giang: 60,3% điều dưỡng có kiến thức đúng về phòng ngừa loét tỳ đè; kiến thức liên quan trình độ chuyên môn và thâm niên. (Việt Nam; Mở, PDF lưu ở thư mục dự án nckh-web)"},{"g":"06","k":"02 · Loét tỳ đè","y":"2024","a":"Đặng Minh Quyết, Trần Quang Huy, Lê Văn Cơ, và cs. · Tạp chí Y học Việt Nam","t":"KIẾN THỨC, THÁI ĐỘ VỀ DỰ PHÒNG LOÉT TỲ ĐÈ CỦA ĐIỀU DƯỠNG BỆNH VIỆN ĐA KHOA QUỐC TẾ VINMEC TIMES CITY NĂM 2024","u":"https://doi.org/10.51298/vmj.v545i3.12395","n":"Vinmec Times City 2024: 77,85% điều dưỡng kiến thức đạt, 80,54% thái độ tích cực về dự phòng loét tỳ đè; yếu tố liên quan là được đào tạo và khối lượng công việc. (Việt Nam; Mở, PDF lưu ở thư mục dự án nckh-web)"},{"g":"06","k":"02 · Loét tỳ đè","y":"2023","a":"Nguyễn Thị Ngọc Phượng, Claywell Lora, Nguyễn Thị Hồng Nương, và cs. · Tạp chí Y học Việt Nam","t":"KIẾN THỨC, THÁI ĐỘ VÀ THỰC HÀNH CỦA ĐIỀU DƯỠNG VỀ DỰ PHÒNG LOÉT TỲ ĐÈ TRÊN BỆNH NHÂN THỞ MÁY","u":"https://doi.org/10.51298/vmj.v525i2.5246","n":"BVĐK Đồng Tháp: kiến thức, thái độ, thực hành của điều dưỡng về dự phòng loét tỳ đè trên người bệnh thở máy và các yếu tố liên quan. Phù hợp khoa Hồi sức. (Việt Nam; Mở, PDF lưu ở thư mục dự án nckh-web)"},{"g":"06","k":"02 · Loét tỳ đè","y":"2025","a":"Nhung Hoàng Thị, Trung Cấn Ngọc, Thu Nguyễn Thị, và cs. · Tạp chí Y học Cộng đồng","t":"KHẢO SÁT KIẾN THỨC CỦA ĐIỀU DƯỠNG VỀ DỰ PHÒNG LOÉT TỲ ĐÈ TẠI BỆNH VIỆN GIAO THÔNG VẬN TẢI NĂM 2024","u":"https://doi.org/10.52163/yhc.v66icd14.3055","n":"BV Giao thông vận tải 2024: điểm kiến thức trung bình 42,34/47, 97,67% mức giỏi trở lên; vẫn còn nội dung yếu cần tập huấn thường xuyên. (Việt Nam; Mở, PDF lưu ở thư mục dự án nckh-web)"},{"g":"06","k":"02 · Loét tỳ đè","y":"2024","a":"Anh Hoàng Lê Phương, Trâm Vũ Thị Ngọc, Đức Nguyễn Linh, và cs. · Tạp chí Y học Cộng đồng","t":"KIẾN THỨC, THÁI ĐỘ, SỰ TUÂN THỦ CỦA ĐIỀU DƯỠNG VỀ ĐÁNH GIÁ VÀ CAN THIỆP NGUY CƠ LOÉT TỲ ĐÈ TẠI BỆNH VIỆN THÀNH PHỐ THỦ ĐỨC","u":"https://doi.org/10.52163/yhc.v65icd12.1816","n":"Kiến thức khá tốt, thái độ khá, tuân thủ đánh giá và can thiệp nguy cơ loét tỳ đè đạt 62,7%; kiến thức liên quan thái độ, nhưng chưa thấy liên quan trực tiếp với tuân thủ. (Việt Nam; Mở, PDF lưu ở thư mục dự án nckh-web)"},{"g":"06","k":"02 · Loét tỳ đè","y":"2022","a":"Wu J, Wang B, Zhu L, et al. · Frontiers in public health","t":"Nurses' knowledge on pressure ulcer prevention: An updated systematic review and meta-analysis based on the Pressure Ulcer Knowledge Assessment Tool","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9493096/","n":"Phân tích gộp quốc tế: điểm kiến thức phòng loét tỳ đè trung bình của điều dưỡng chỉ 51,5%, sinh viên 48,9%; yếu nhất ở phân loại/đánh giá loét. Cho thấy nhu cầu đào tạo chung toàn cầu. (Quốc tế; Mở, PDF lưu ở thư mục dự án   function saveLegalDoc(type){
    if(!db) return;
    var name = document.getElementById("f-legal-name").value.trim();
    var note = document.getElementById("f-legal-note").value.trim();
    var url = document.getElementById("f-legal-url").value.trim();
    var scope = document.getElementById("f-legal-scope").value;
    if(!name){ showToast("Vui lòng nhập tên",true); return; }
    if(url && !safeUrl(url)){ showToast("Link phải bắt đầu bằng http:// hoặc https://",true); return; }
    var data = { type:type, name:name, note:note, url:url||null, scope:scope, addedBy:meLabel(), addedAt:nowIso() };
    if(type==="legal"){
      data.number = document.getElementById("f-legal-number").value.trim();
      data.status = document.getElementById("f-legal-status").value;
    }
    db.collection("legal_docs").add(data).then(function(){
      showToast("Đã thêm");
      state.modal=null; render();
    }).catch(function(e){ showToast("Lỗi: "+(e&&e.message||e),true); });
  }

  function renderTrainingList(group, title, desc){
    var list = state.trainings.filter(function(t){ return (TRAINING_GROUP[t.category]||"training")===group; });
    var html = '<div class="pagehead"><div><h2>'+esc(title)+'</h2><p>'+list.length+' hoạt động — '+esc(desc)+'</p></div></div>';
    var sortedList = list.slice().sort(function(a,b){ return (b.sessionDate||b.period||"").localeCompare(a.sessionDate||a.period||""); });
    html += tocHtml(sortedList.map(function(t){ return {id:"training-"+t.id, label:t.code+" — "+t.title}; }));
    html += '<div class="listcards">';
    sortedList.forEach(function(t){
      var total = (t.enrollments||[]).length;
      var done = (t.enrollments||[]).filter(function(e){ return e.status==="da_hoan_thanh"; }).length;
      var pct = total ? Math.round(done/total*100) : 0;
      var tone = pct>=85?"ok":(pct>=60?"warn":"danger");
      var cat = TRAINING_CATEGORY[t.category];
      var whenText = t.sessionDate ? fmtDate(t.sessionDate) : (t.period || "—");

      var codeHtml = t.url ? '<a href="'+esc(t.url)+'" target="_blank" rel="noopener" title="Mở tài liệu gốc" onclick="event.stopPropagation()">'+esc(t.code)+'</a>' : esc(t.code);

        '<div class="row1"><span class="code">'+codeHtml+'</span><span class="name">'+esc(t.title)+'</span>'+(cat?badge(cat.tone,cat.label):"")+(t.durationHours?badge("muted",t.durationHours+" giờ"):"")+(total?badge(tone,pct+"% hoàn thành ("+done+"/"+total+")"):"")+'</div>'+
        '<div class="meta">'+(t.relatedSopCode?"SOP: "+esc(t.relatedSopCode)+" · ":"")+"Phạm vi: "+esc(t.scope==="all"?"Toàn viện":deptName(t.scope))+' · Giảng viên: '+esc(t.trainer||"—")+' · Thời gian: '+esc(whenText)+(t.frequency?' ('+esc(t.frequency)+')':'')+'</div>'+

  function renderPlanGroups(title, desc, types){
    var list = state.plans.filter(function(p){ return types.indexOf(p.type)!==-1; });
    var html = '<div class="pagehead"><div><h2>'+esc(title)+'</h2><p>'+esc(desc)+'</p></div></div>';
    if(!list.length){ html += '<div class="empty">Chưa có mục nào được nạp.</div>'; return html; }

    var groups = {};
    types.forEach(function(t){ groups[t]=[]; });
    list.forEach(function(p){ groups[p.type].push(p); });
    if(groups.monthly){ groups.monthly.sort(function(a,b){ return (a.period||"").localeCompare(b.period||""); }); }

    html += tocGroupsHtml(types.map(function(t){
      var meta = PLAN_TYPE[t]||{label:t,tone:"muted"};
      return {label:meta.label, items:(groups[t]||[]).map(function(p){ return {id:"plan-"+p.id, label:p.title}; })};
    }));

    types.forEach(function(t){
      if(!groups[t] || !groups[t].length) return;
      var meta = PLAN_TYPE[t]||{label:t,tone:"muted"};
      html += '<div class="section"><h3>'+esc(meta.label)+'</h3><div class="listcards">';

  function sdbSectionPct(sec){
    var vals = (sec && sec.values) || [];
    var dat=0, total=0;
    vals.forEach(function(v){ if(v==="dat"){dat++;total++;} else if(v==="chua_dat"){total++;} });
    return total>0 ? Math.round((dat/total)*100) : null;
  }
  function sdbOverallPct(sections){
    var dat=0, total=0;
    SODIBUONG_SECTIONS.forEach(function(s){
      var vals = ((sections||{})[s.key]||{}).values || [];
      vals.forEach(function(v){ if(v==="dat"){dat++;total++;} else if(v==="chua_dat"){total++;} });
    });
    return total>0 ? Math.round((dat/total)*1000)/10 : null;
  }
  function sdbCountIssues(r){
    var n = 0;
    SODIBUONG_SECTIONS.forEach(function(s){
      var vals = (r.sections&&r.sections[s.key]&&r.sections[s.key].values)||[];
      vals.forEach(function(v){ if(v==="chua_dat") n++; });
    });
    return n;
  }

  function saveSdb(){
    if(!db) return;
    var dept = document.getElementById("sdb-dept").value;
    var inspector = document.getElementById("sdb-inspector").value.trim();
    var date = document.getElementById("sdb-date").value;
    var time = document.getElementById("sdb-time").value;
    var sections = {};
    SODIBUONG_SECTIONS.forEach(function(s){
      var values = s.items.map(function(_,idx){
        var el = document.querySelector('input[name="sdb-'+s.key+'-'+idx+'"]:checked');
        return el ? el.value : "khong_thuc_hien";
      });
      var note = document.getElementById("sdb-note-"+s.key).value.trim();
      sections[s.key] = {values:values, note:note};
    });
    var feedback = [];
    for(var k=1;k<=3;k++){
      var name = document.getElementById("sdb-v"+k+"-name").value.trim();

  function renderSops(){
    var f = state.filters.sops;
    var html = '<div class="pagehead"><div><h2>SOP QTKT - QTCS</h2><p>'+state.sops.filter(function(s){return s.category!=="ttgdsk";}).length+' quy trình — theo dõi hiệu lực, căn cứ pháp lý và phê duyệt</p></div>'+
      '<button class="btn primary" data-action="open-add-sop">'+ICONS.plus+'Tạo SOP dự thảo</button></div>';
    html += '<div class="filters">';
    html += '<select data-filter="sopDept">'+optHtml(deptList(),f.dept)+'</select>';
    html += '<select data-filter="sopStatus"><option value="all"'+(f.status==="all"?" selected":"")+'>Tất cả trạng thái</option>'+
      Object.keys(SOP_STATUS).map(function(k){ return '<option value="'+k+'"'+(f.status===k?" selected":"")+'>'+esc(SOP_STATUS[k].label)+'</option>'; }).join("")+
      '</select></div>';

    var rows = state.sops.filter(function(s){
      if(s.category==="ttgdsk") return false;
      if(f.dept!=="all" && s.department!==f.dept) return false;
      if(f.status!=="all" && s.status!==f.status) return false;
      return true;
    }).sort(function(a,b){ return a.code.localeCompare(b.code); });

    var cats = ["qtkt","qtcs","khac"];
    var groups = {qtkt:[],qtcs:[],khac:[]};
    rows.forEach(function(s){ (groups[s.category]||groups.khac).push(s); });

    if(!rows.length){ html += '<div class="empty">Không có SOP phù hợp.</div>'; return html; }

    html += tocGroupsHtml(cats.map(function(c){
      return {label:SOP_CATEGORY[c].label, items:groups[c].map(function(s){ return {id:"sop-"+s.id, label:s.code+" — "+s.name}; })};
    }));

    var legalRefs = {};
    rows.forEach(function(s){
      (s.legalBasis||[]).forEach(function(b){
        if(!b.number) return;
        if(!legalRefs[b.number]) legalRefs[b.number] = {name:b.name, number:b.number, status:b.status, count:0};
        legalRefs[b.number].count++;
      });
    });
    var legalRefList = Object.keys(legalRefs).map(function(k){ return legalRefs[k]; }).sort(function(a,b){ return a.number.localeCompare(b.number); });
    if(legalRefList.length){
      var lrHdr = collapsibleHeader("sops-legalrefs", "Văn bản pháp lý liên quan ("+legalRefList.length+")");
      html += '<div class="section">'+lrHdr.headerHtml;
      if(!lrHdr.isCollapsed){
        html += '<div class="timeline">'+legalRefList.map(function(lr){
          var match = findLegalDocRef(lr.number);
          var lm = LEGAL_STATUS[lr.status]||{label:lr.status,tone:"muted"};
          var style = "border-left-color:var(--info)"+(match?";cursor:pointer":"");
          var attrs = match ? ' data-action="goto-legaldoc" data-id="'+esc(match.id)+'" data-tab="'+(match.type==="reference"?"referencedocs":"legaldocs")+'" data-group-key="'+(match.type==="reference"?"refdocs-":"legaldocs-")+esc(match.scope||"external")+'"' : '';
          return '<div class="ev"'+attrs+' style="'+style+'"><b>'+esc(lr.number)+'</b>'+(lr.name?' — '+esc(lr.name):'')+' '+badge(lm.tone,lm.label)+
            '<div class="when">Dùng làm căn cứ trong '+lr.count+' SOP'+(match?'':' · <span class="hint">Chưa có trong mục Văn bản pháp lý</span>')+'</div></div>';
        }).join("")+'</div>';
      }
      html += '</div>';
    }

    cats.forEach(function(c){
      if(!groups[c].length) return;
      var meta = SOP_CATEGORY[c];
      var hdr = collapsibleHeader("sops-"+c, esc(meta.label)+' ('+groups[c].length+')');
      html += '<div class="section">'+hdr.headerHtml;
      if(!hdr.isCollapsed){
        html += '<div class="tablewrap"><table><thead><tr><th>Mã SOP</th><th>Tên quy trình</th><th>Khoa</th><th>PB</th><th>Trạng thái</th><th>Văn bản pháp lý</th><th>Tài liệu tham khảo</th><th>Tài liệu PĐD</th><th>Kiểm tra QTKT</th><th>Rà soát</th></tr></thead><tbody>';
        groups[c].forEach(function(s){ html += sopRowHtml(s); });
        html += '</tbody></table></div>';
      }
      html += '</div>';
    });
    return html;
  }

    }

      if(s.status==="draft"){
        actions += '<button class="btn" data-action="sop-transition" data-id="'+esc(s.id)+'" data-to="under_review">Đưa vào rà soát</button>';

        actions += '<button class="btn primary" data-action="sop-approve" data-id="'+esc(s.id)+'" '+(canApprove?"":"disabled title=\"Cần quyền biên tập (Can edit) để phê duyệt/ban hành\"")+'>Phê duyệt &amp; Ban hành</button>';

    }
    return modalWrap(esc(s.code)+" — "+esc(s.name), body, actions);
  }

  function sopTransition(id,to,extra){
    if(!db) return;
    var s = findSop(id);
    if(!s) return;
    var history = (s.history||[]).slice();
    var patch = Object.assign({status:to}, extra||{});
    var actionLabel = to==="effective" ? "Phê duyệt và ban hành" : (to==="under_review" ? "Đưa vào rà soát" : "Cập nhật trạng thái");
    history.push({at:nowIso(),action:actionLabel,by:meLabel(),note:to==="effective"?"":""});
    patch.history = history;
    db.collection("sops").doc(id).update(patch).then(function(){
      showToast("Đã cập nhật "+s.code);
      state.modal=null; render();
    }).catch(function(e){ showToast("Lỗi: "+(e&&e.message||e),true); });
  }

  function saveSop(){
    if(!db) return;
    var code = document.getElementById("f-sop-code").value.trim();
    var dept = document.getElementById("f-sop-dept").value;
    var name = document.getElementById("f-sop-name").value.trim();
    var category = document.getElementById("f-sop-category").value;
    var legalNum = document.getElementById("f-sop-legal").value.trim();
    var owner = document.getElementById("f-sop-owner").value.trim();
    var refsRaw = document.getElementById("f-sop-refs").value;
    var pddRaw = document.getElementById("f-sop-pdd").value;
    if(!code || !name){ showToast("Vui lòng nhập mã và tên SOP",true); return; }
    var legalBasis = legalNum ? [{name:"Cần bổ sung tên đầy đủ văn bản",number:legalNum,status:"can_xac_minh"}] : [];
    var references = refsRaw.split("\n").map(function(x){return x.trim();}).filter(Boolean);
    var pddDocs = pddRaw.split("\n").map(function(x){return x.trim();}).filter(Boolean);
    var docId = code.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || ("sop-"+Date.now());
    var dup = state.sops.filter(function(x){ return x.id===docId || (x.code||"").toLowerCase()===code.toLowerCase(); })[0];
    if(dup){ showToast("Mã SOP đã tồn tại ("+dup.code+") — vui lòng dùng mã khác",true); return; }
    db.collection("sops").doc(docId).get().then(function(snap){
      if(snap && snap.exists){ throw new Error("Mã SOP đã tồn tại — vui lòng dùng mã khác"); }
      return db.collection("sops").doc(docId).set({
        code:code,name:name,department:dept,category:category,version:"0.1",status:"draft",
        issueDate:null,effectiveDate:null,reviewDate:null,
        legalBasis:legalBasis, references:references, pddDocs:pddDocs, kiemTraQtkt:null, relatedForms:[], relatedChecklists:[], owner:owner||deptName(dept),
        history:[{at:nowIso(),action:"Tạo dự thảo",by:meLabel(),note:"DỰ THẢO phục vụ rà soát và phê duyệt nội bộ - chưa ban hành"}]
      });
    }).then(function(){
      showToast("Đã tạo dự thảo "+code);
      state.modal=null; render();
    }).catch(function(e){ showToast("Lỗi: "+(e&&e.message||e),true); });
  }

  function renderChecklists(){
    var html = '<div class="pagehead"><div><h2>Tuân thủ quy trình</h2><p>'+state.checklists.length+' bảng kiểm — nhấn để xem chi tiết hoặc thực hiện đánh giá mới</p></div></div>';
    var sortedChecklists = state.checklists.slice().sort(function(a,b){return a.code.localeCompare(b.code);});
    html += tocHtml(sortedChecklists.map(function(c){ return {id:"checklist-"+c.id, label:c.code+" — "+c.name}; }));
    html += '<div class="listcards">';
    sortedChecklists.forEach(function(c){
      var rate = c.complianceRate;
      var hasRate = typeof rate==="number";
      var tone = !hasRate?"muted":(rate>=90?"ok":(rate>=75?"warn":"danger"));
      var codeHtml = c.url ? '<a href="'+esc(c.url)+'" target="_blank" rel="noopener" title="Mở tài liệu gốc" onclick="event.stopPropagation()">'+esc(c.code)+'</a>' : esc(c.code);
      html += '<div class="itemcard" id="checklist-'+esc(c.id)+'" data-action="open-checklist" data-id="'+esc(c.id)+'">'+
        '<div class="row1"><span class="code">'+codeHtml+'</span><span class="name">'+esc(c.name)+'</span>'+badge(tone,hasRate?rate+"% tuân thủ":"Chưa có kết quả")+'</div>'+
        '<div class="meta">SOP: '+esc(c.sopCode||"—")+' · '+esc(c.department==="all"?"Áp dụng toàn viện":deptName(c.department))+' · '+(c.recentResults||[]).length+' lượt đánh giá gần đây</div>'+
        '<div class="meta">Tài liệu phòng Điều dưỡng: '+((c.pddDocs||[]).length?esc(c.pddDocs.join("; ")):'<span class="hint">Chưa có</span>')+'</div></div>';
    });
    if(!state.checklists.length){ html += '<div class="empty">Chưa có checklist.</div>'; }
    html += '</div>';
    return html;
  }

  function submitChecklist(id){
    if(!db) return;
    var c = findChecklist(id);
    if(!c) return;
    var dat=0, total=0;
    var cmap = D24_ITEM_CONTENT[c.id], itemResults = {}, per = {};
    (c.items||[]).forEach(function(it){
      var val = (document.querySelector('input[name="ck-'+it.id+'"]:checked')||{}).value || "na";
      if(c.scale==="012"){ if(val!=="na"){ dat += Number(val)||0; total += 2; } }
      else if(val==="dat"){ dat++; total++; } else if(val==="khong_dat"){ total++; }
      if(cmap){
        itemResults[it.id] = val;
        if(val!=="na"){ var k = cmap[it.id]||"khac", pc = per[k] = per[k]||{dat:0,tong:0}; pc.tong++; if(val==="dat") pc.dat++; }
      }
    });
    if(cmap && !total){ showToast("Chưa có tiêu chí nào được đánh giá (tất cả đang là N/A)",true); return; }
    if(c.scale==="012" && !total){ showToast("Chưa có mục nào được chấm (tất cả đang là KAD)",true); return; }
    var score = total>0 ? Math.round((dat/total)*100) : 100;
    var dept = document.getElementById("f-ck-dept").value;
    var shift = document.getElementById("f-ck-shift").value;
    var staff = document.getElementById("f-ck-staff").value.trim() || meLabel();
    var note = document.getElementById("f-ck-note").value.trim();
    var entry = {at:nowIso(),department:dept,shift:shift,staffName:staff,scorePct:score,note:note};
    var patch = {};
    if(cmap){
      var ctEl = document.getElementById("f-ck-content");
      entry.content = ctEl ? ctEl.value : "all";
      entry.itemResults = itemResults;
      /* Cộng dồn số liệu theo khoa, nội dung và từng tiêu chí (không bị giới hạn 20 lượt gần nhất) */
      var cTally = JSON.parse(JSON.stringify(c.contentTally||{})), iTally = JSON.parse(JSON.stringify(c.itemTally||{}));
      Object.keys(per).forEach(function(k){
        var cd = cTally[dept] = cTally[dept]||{};
        var x = cd[k] = cd[k]||{luot:0,luotDat:0,mucDat:0,mucTong:0};
        x.luot++; if(per[k].dat===per[k].tong) x.luotDat++; x.mucDat += per[k].dat; x.mucTong += per[k].tong;
      });
      Object.keys(itemResults).forEach(function(iid){
        var v = itemResults[iid]; if(v==="na") return;
        var idp = iTally[dept] = iTally[dept]||{};
        var y = idp[iid] = idp[iid]||{dat:0,tong:0};
        y.tong++; if(v==="dat") y.dat++;
      });
      patch.contentTally = cTally; patch.itemTally = iTally;
    }
    var results = [entry].concat(c.recentResults||[]);
    if(results.length>20) results = results.slice(0,20);
    var rate = avg(results.map(function(r){return r.scorePct;}));
    patch.recentResults = results; patch.complianceRate = rate;
    db.collection("checklists").doc(id).update(patch).then(function(){
      showToast("Đã ghi nhận đánh giá — điểm "+score+"%"+(c.passThreshold?(score>=c.passThreshold?" · Đạt":" · Chưa đạt"):""));
      state.modal=null; render();
    }).catch(function(e){ showToast("Lỗi: "+(e&&e.message||e),true); });
  }

  /* Thống kê phân loại tính trực tiếp từ các sự cố đã ghi nhận trong phần mềm */

        rows.map(function(r){ return '<tr><td style="white-space:normal;min-width:180px">'+r[0]+'</td><td class="num">'+r[1]+'</td><td class="num">'+(total?Math.round(r[1]/total*100):0)+'%</td></tr>'; }).join("")+
        '</tbody></table></div></div>';
    }
    var bySev = Object.keys(SEVERITY).map(function(k){ return [badge(SEVERITY[k].tone,SEVERITY[k].nc)+' '+esc(SEVERITY[k].label), list.filter(function(i){ return i.severity===k; }).length]; });
    var byType = Object.keys(REPORT_TYPE).map(function(k){ return [esc(REPORT_TYPE[k].label), list.filter(function(i){ return incReportType(i).key===k; }).length]; });
    var byGroup = INCIDENT_GROUPS.map(function(g){ return [esc(g.code+". "+g.title), list.filter(function(i){ return i.incidentGroup && String(i.incidentGroup).split(".")[0]===g.code; }).length]; }).filter(function(r){ return r[1]>0; });
    var noGroup = list.filter(function(i){ return !i.incidentGroup; }).length;
    if(noGroup) byGroup.push(['<span class="hint">Chưa phân loại nhóm</span>', noGroup]);
    var byCause = CAUSE_GROUPS.map(function(g){ return [esc(g.code+". "+g.title), list.filter(function(i){ return (i.causes||[]).some(function(c){ return c.split(".")[0]===g.code; }); }).length]; }).filter(function(r){ return r[1]>0; });
    var noCause = list.filter(function(i){ return !(i.causes||[]).length; }).length;
    if(noCause) byCause.push(['<span class="hint">Chưa phân tích nguyên nhân</span>', noCause]);
    var html = '<div class="hint" style="margin-bottom:10px">Theo Điều 7 Thông tư 43/2018/TT-BYT, sự cố được phân loại theo mức độ tổn thương (Phụ lục I), theo nhóm sự cố và theo nguyên nhân (Phụ lục IV); sự cố NC3 đối chiếu thêm Danh mục Phụ lục II. Một sự cố có thể có nhiều nguyên nhân nên tổng cột nguyên nhân có thể vượt số sự cố. Số liệu tính trên '+total+' sự cố có trong phần mềm.</div>';

    return html;

  /* Báo cáo Sở Y tế theo Công văn 7738/SYT-NVY: đợt 01/01–30/9/2026 và định kỳ hằng quý */
  function soyteSent(id){ return state.soyteReports.filter(function(r){ return r.id===id && r.sentAt; })[0]; }
  function incDateStr(i){ return localDateStr(new Date(i.occurredAt||i.reportedAt)); }
  function soyteSectionHtml(){
    var today = localDateStr(new Date());
    var week = state.incidents.filter(function(i){ return i.reportedAt && daysBetween(localDateStr(new Date(i.reportedAt)), today) < 7; }).length;

    html += '<div class="hint" style="margin-bottom:8px">Báo cáo do người đứng đầu bệnh viện ký, gửi Sở Y tế (Phòng Nghiệp vụ Y). Định kỳ hằng quý gửi trước ngày 05 tháng đầu quý sau; sự cố bắt buộc báo cáo đột xuất ngay. Không có sự cố vẫn phải gửi báo cáo. Bộ phận đầu mối báo cáo giám đốc hằng tuần: <b>'+week+'</b> sự cố ghi nhận trong 7 ngày qua.</div>';
    html += '<div class="listcards">';
    soyteReportPeriods().slice().reverse().forEach(function(pr){

      var n = state.incidents.filter(function(i){ var d=incDateStr(i); return d>=pr.from && d<=pr.to; }).length;
      var tag = sent ? badge("ok","Đã gửi "+fmtDate(sent.sentAt)) : (left<0 ? badge("danger","Quá hạn "+(-left)+" ngày") : badge(left<=10?"warn":"info","Còn "+left+" ngày"));
      html += '<div class="itemcard" data-action="open-soyte-summary" data-id="'+esc(pr.id)+'"><div class="row1"><span class="name">'+esc(pr.label)+'</span>'+tag+'</div>'+
        '<div class="meta">Kỳ '+fmtDate(pr.from)+' – '+fmtDate(pr.to)+' · Hạn gửi '+fmtDate(pr.due)+' · '+n+' sự cố trong phần mềm</div></div>';
    });
    html += '</div>';
    var soyteFiles = state.legalDocs.filter(function(d){ return d.group==="soyte" && (d.file||d.url); });
    if(soyteFiles.length){
      html += '<div style="font-weight:700;font-size:12.3px;margin:12px 0 4px">Hồ sơ báo cáo đã lập</div>';
      html += soyteFiles.map(function(d){ return '<div style="font-size:12.5px"><a href="'+esc(d.file||d.url)+'" target="_blank" rel="noopener">'+esc(d.name)+'</a>'+(d.note?' <span class="hint">· '+esc(d.note)+'</span>':'')+'</div>'; }).join("");
    }
    html += '</div>';

  function soyteSummaryText(pr){
    var list = state.incidents.filter(function(i){ var d=incDateStr(i); return d>=pr.from && d<=pr.to; });
    var lines = [];
    lines.push(pr.label.toUpperCase());
    lines.push("Kỳ báo cáo: "+fmtDate(pr.from)+" – "+fmtDate(pr.to));
    lines.push("Tổng số sự cố y khoa ghi nhận: "+list.length+(list.length?"":" (không có sự cố; vẫn gửi báo cáo theo quy định)"));
    lines.push("");
    lines.push("1. Theo hình thức báo cáo:");
    Object.keys(REPORT_TYPE).forEach(function(k){ lines.push("   - "+REPORT_TYPE[k].label+": "+list.filter(function(i){ return incReportType(i).key===k; }).length); });
    lines.push("2. Theo mức độ tổn thương (Phụ lục I):");
    Object.keys(SEVERITY).forEach(function(k){ lines.push("   - "+SEVERITY[k].label+": "+list.filter(function(i){ return i.severity===k; }).length); });
    lines.push("3. Theo nhóm sự cố (Phụ lục IV):");
    INCIDENT_GROUPS.forEach(function(g){ var c=list.filter(function(i){ return i.incidentGroup && String(i.incidentGroup).split(".")[0]===g.code; }).length; if(c) lines.push("   - "+g.code+". "+g.title+": "+c); });
    var ng = list.filter(function(i){ return !i.incidentGroup; }).length; if(ng) lines.push("   - Chưa phân loại nhóm: "+ng);
    lines.push("4. Theo nhóm nguyên nhân (Phụ lục IV):");
    CAUSE_GROUPS.forEach(function(g){ var c=list.filter(function(i){ return (i.causes||[]).some(function(x){ return x.split(".")[0]===g.code; }); }).length; if(c) lines.push("   - "+g.code+". "+g.title+": "+c); });
    var nc = list.filter(function(i){ return !(i.causes||[]).length; }).length; if(nc) lines.push("   - Chưa phân tích nguyên nhân: "+nc);
    var adr = list.filter(function(i){ return i.relatedAdr; }).length;
    if(adr) lines.push("   Ghi chú: "+adr+" sự cố có liên quan ADR/phản vệ (đã đối chiếu báo cáo cảnh giác dược).");
    lines.push("5. Biện pháp khắc phục, phòng ngừa đã triển khai:");
    var acts = [];
    list.forEach(function(i){
      (i.actionPlan||[]).forEach(function(a){ acts.push("   - "+a.content+" (phụ trách: "+(a.owner||"—")+"; hạn "+fmtDate(a.due)+"; "+(a.doneAt?"đã hoàn thành":"đang thực hiện")+(a.indicator?"; chỉ số: "+a.indicator:"")+")"); });
      (i.correctiveActions||[]).forEach(function(a){ var t = typeof a==="string"?a:(a&&(a.action||a.content||a.text)); if(t) acts.push("   - "+t); });
    });
    if(acts.length) lines = lines.concat(acts); else lines.push("   - ");
    lines.push("6. Khó khăn, vướng mắc và đề xuất:");
    lines.push("   - ");
    return lines.join("\n");
  }

  function soyteMarkSent(id){
    if(!db || state.me.canEdit!==true) return;
    var rec = {sentAt:localDateStr(new Date()), by:meLabel()};
    db.collection("soyte_reports").doc(id).set(rec).then(function(){
      var ex = state.soyteReports.filter(function(r){ return r.id===id; })[0];
      if(ex) Object.assign(ex, rec); else state.soyteReports.push(Object.assign({id:id}, rec));

      forceModal = true; render();

  function renderChiSoPdd(){
    var html = '<div class="pagehead"><div><h2>Tiêu chí chất lượng PĐD</h2><p>Chỉ tiêu chất lượng do Phòng Điều dưỡng phụ trách — tổng hợp từ Kế hoạch chỉ số QLCL 2026 và Phân bổ chỉ số chất lượng theo khoa/phòng 2026</p></div></div>';

    html += roadmapTieuChiHtml();
    html += tieuChiBangKiemHtml("C6.1");
    html += tieuChiBangKiemTmHtml();
    html += d24SurveyHtml();

    var qlcl = state.plans.filter(function(p){ return p.id==="plan-chiso-qlcl-2026"; })[0];
    var phanbo = state.plans.filter(function(p){ return p.id==="plan-phanbo-chiso-khoaphong-2026"; })[0];
    var kpiRef = state.legalDocs.filter(function(d){ return d.id==="legal-ref-kpi-pdd"; })[0];

    var results = state.qualityResults.slice();
    var lichsu = state.plans.filter(function(p){ return p.id==="plan-lichsu-chiso-2020-2026"; })[0];
    var lichsuByYear = {};
    var lichsuDocsByYear = {};
    (lichsu&&lichsu.sections||[]).forEach(function(s){
      var m = (s.heading||"").match(/\d{4}/g);
      (m||[]).forEach(function(y){ lichsuByYear[y] = s.items||[]; });
    });
    (lichsu&&lichsu.pddDocs||[]).forEach(function(d){
      var m = d.match(/\d{4}/);
      if(!m) return;
      var parts = d.split(" — ");
      (lichsuDocsByYear[m[0]] = lichsuDocsByYear[m[0]]||[]).push({title:parts[0], url:parts[1]||null});
    });
    if(qlcl && qlcl.url) (lichsuDocsByYear["2026"]=lichsuDocsByYear["2026"]||[]).push({title:qlcl.title, url:qlcl.url});
    if(phanbo && phanbo.url) (lichsuDocsByYear["2026"]=lichsuDocsByYear["2026"]||[]).push({title:phanbo.title, url:phanbo.url});
    (lichsu&&lichsu.docs2024||[]).forEach(function(d){ (lichsuDocsByYear["2024"]=lichsuDocsByYear["2024"]||[]).push(d); });
    (lichsu&&lichsu.docs2025||[]).forEach(function(d){ (lichsuDocsByYear["2025"]=lichsuDocsByYear["2025"]||[]).push(d); });

    var yearSet = {};
    Object.keys(lichsuByYear).forEach(function(y){ yearSet[y]=true; });
    results.forEach(function(r){ yearSet[r.year || ((r.period||"").match(/\d{4}/)||[])[0] || "Chưa rõ năm"] = true; });
    var years = Object.keys(yearSet).sort(function(a,b){ return b.localeCompare(a); });

    html += '<div class="section"><h3>Khung tiêu chí chất lượng theo năm (2020 – nay)</h3>';
    html += '<div style="margin-bottom:10px"><button class="btn primary" data-action="open-add-qr" '+(state.dbAvailable?"":"disabled")+'>'+ICONS.plus+'Nhập kết quả</button></div>';
    if(lichsu && lichsu.note) html += '<div class="hint" style="margin-bottom:10px">'+esc(lichsu.note)+'</div>';
    if(!years.length){
      html += '<div class="empty">Chưa có số liệu theo năm nào — dùng nút "Nhập kết quả" để bắt đầu ghi nhận.</div>';
    } else {
      var blankYears = [];
      function flushBlank(){
        if(!blankYears.length) return;
        var seen = {}, notes = [];
        blankYears.forEach(function(by){

  /* Bảng kiểm tự đánh giá theo bộ hồ sơ chính thức 2026: tiểu mục mức 1–5 lấy từ TIEUCHI_TIEUMUC, kết quả lưu chung collection tieuchi_tudanhgia (doc "<mã>-<năm>").
     Mức tạm tính: có mục mức 1 không đạt thì mức 1; còn lại là mức cao nhất L mà mọi mục mức 1..L đều Đạt. */
  var TCBK_TM_CODES = ["A2.1","A4.1","A4.2","C6.2","C6.3","D2.4"];
  function tcbkTmLevel(list, items){
    function v(x){ return (items[x.n]||{}).kq; }
    var scored = list.filter(function(x){ return v(x); }).length;
    if(list.some(function(x){ return x.m===1 && v(x)==="khong_dat"; })) return {level:1, tone:"danger", text:"Mức 1 (có mục mức 1 không đạt)", scored:scored};
    var L = 1, blocked = null;
    for(var m=1;m<=5;m++){
      var lv = list.filter(function(x){ return x.m===m; });
      if(lv.every(function(x){ return v(x)==="dat"; })){ if(m>=2) L = m; continue; }
      blocked = lv.some(function(x){ return v(x)==="khong_dat"; }) ? "khong_dat" : "chua_cham";
      break;
    }
    var text = (L>=2?"Đạt mức "+L:"Mức 1")+(blocked==="chua_cham"?" (tạm tính, còn mục chưa chấm)":"");
    return {level:L, tone: blocked==="chua_cham" ? "muted" : (L>=4?"ok":(L>=2?"warn":"danger")), text:text, scored:scored};
  }

  function renderDepartments(){

    var totalStaff = 0, totalBeds = 0;
    list.forEach(function(d){ totalStaff += (d.staffCount||0); totalBeds += (d.bedCount||0); });

    list.forEach(function(d){
      var staffRecs = state.staff.filter(function(s){ return s.department===d.code; });

      var plans = state.plans.filter(function(p){ return p.department===d.code; });
      var crit = [];
      var heading = DEPT_QUALITY_HEADING[d.code];
      if(phanbo && heading){
        var sec = (phanbo.sections||[]).filter(function(s){ return s.heading.indexOf(heading)!==-1; })[0];
        if(sec) crit = sec.items||[];
      }

      html += '<div class="deptcard" id="dept-'+esc(d.code)+'"><div class="dname">'+esc(d.name)+'</div>';
      html += '<div class="dstats">'+
        '<div><b>'+(typeof d.staffCount==="number"?d.staffCount:"—")+(d.staffCountNote?'<span class="hint" title="'+esc(d.staffCountNote)+'">*</span>':'')+'</b><span>Nhân sự</span></div>'+
        '<div><b>'+sops.length+'</b><span>SOP</span></div>'+
        '<div><b>'+plans.length+'</b><span>Kế hoạch/BC</span></div>'+
        '<div><b>'+crit.length+'</b><span>Chỉ số CL</span></div>'+
        '</div>';
      if(d.bedCount>0){
        html += '<div class="hint" style="margin-bottom:6px">'+d.bedCount+' giường'+((d.bedActual||d.bedExtra)?' ('+d.bedActual+' thực + '+d.bedExtra+' kê thêm)':'')+'</div>';
      }

      html += '<details><summary>Nhân sự — hồ sơ chi tiết ('+staffRecs.length+')</summary>';
      html += staffRecs.length
        ? '<ul>'+staffRecs.map(function(s){ return '<li>'+esc(s.name)+(s.title?' <span class="hint">· '+esc(s.title)+'</span>':'')+'</li>'; }).join("")+'</ul>'
        : '<div class="hint">Chưa nhập hồ sơ chi tiết cá nhân cho khoa này.</div>';
      html += '<div style="margin-top:6px"><button class="btn" data-action="open-add-staff" data-dept="'+esc(d.code)+'" '+(state.dbAvailable?"":"disabled")+'>'+ICONS.plus+'Thêm nhân sự</button></div>';
      html += '</details>';

      html += '<details><summary>Chuyên môn — SOP ('+sops.length+')</summary>';
      if(sops.length){
        ["qtkt","qtcs","ttgdsk","khac"].forEach(function(cat){
          var cs = sops.filter(function(s){ return (s.category||"khac")===cat; });
          if(!cs.length) return;
          html += '<div class="dcat">'+esc(SOP_CATEGORY[cat].label)+' ('+cs.length+')</div><ul>'+cs.map(function(s){ return '<li>'+esc(s.name)+'</li>'; }).join("")+'</ul>';
        });

      html += '</details>';

      html += '<details><summary>Kế hoạch &amp; báo cáo ('+plans.length+')</summary>';
      html += plans.length
        ? '<ul>'+plans.map(function(p){ var t = p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.title)+'</a>':esc(p.title); return '<li>'+t+' <span class="hint">· '+esc((PLAN_TYPE[p.type]||{}).label||p.type||"")+(p.period?' · '+esc(p.period):'')+'</span></li>'; }).join("")+'</ul>'
        : '<div class="hint">Chưa có kế hoạch/báo cáo riêng của khoa này.</div>';

      html += '<details><summary>Tiêu chí chất lượng 2026 ('+crit.length+')</summary>';

      html += '</details>';

      var sdb = state.sodibuong.filter(function(r){ return r.department===d.code; }).sort(function(a,b){ return (b.roundDate||"").localeCompare(a.roundDate||""); });

      html += '</details>';

      var ckList = state.checklists.filter(function(c){ return c.department==="all" || c.department===d.code; });
      html += '<details><summary>Tuân thủ quy trình ('+ckList.length+')</summary>';
      html += ckList.length
        ? '<ul>'+ckList.map(function(c){
            var deptResults = (c.recentResults||[]).filter(function(r){ return r.department===d.code; });
            var last = deptResults[0];
            return '<li><span style="color:var(--accent);cursor:pointer;text-decoration:underline" data-action="open-checklist" data-id="'+esc(c.id)+'" data-dept="'+esc(d.code)+'">'+esc(c.code)+' — '+esc(c.name)+'</span>'+(last?' <span class="hint">· lần gần nhất '+last.scorePct+'%</span>':' <span class="hint">· chưa có lượt đánh giá riêng của khoa</span>')+'</li>';
          }).join("")+'</ul>'
        : '<div class="hint">Chưa có bảng kiểm áp dụng cho khoa này.</div>';
      html += '</details>';

      var incs = state.incidents.filter(function(r){ return r.department===d.code; });
      html += '<details><summary>Sự cố y khoa ('+incs.length+')</summary>';
      html += '<div style="margin:6px 0"><button class="btn" data-action="open-add-incident" data-dept="'+esc(d.code)+'" '+(state.dbAvailable?"":"disabled")+'>'+ICONS.plus+'Báo cáo sự cố</button></div>';
      html += incs.length
        ? '<ul>'+incs.map(function(r){ var st=INCIDENT_STATUS[r.status]||{label:r.status||"—"}; return '<li>'+esc(r.title)+' <span class="hint">· '+esc(st.label)+'</span></li>'; }).join("")+'</ul>'
        : '<div class="hint">Chưa ghi nhận sự cố nào cho khoa này.</div>';
      html += '</details>';

      var eq = state.equipment.filter(function(r){ return r.department===d.code; });
      html += '<details><summary>Thiết bị, vật tư ('+eq.length+')</summary>';
      html += '<div style="margin:6px 0"><button class="btn" data-action="open-add-equip" data-dept="'+esc(d.code)+'" '+(state.dbAvailable?"":"disabled")+'>'+ICONS.plus+'Thêm thiết bị</button></div>';
      html += eq.length
        ? '<ul>'+eq.map(function(r){ var st=EQUIP_STATUS[r.status]||{label:r.status||"—"}; return '<li>'+esc(r.name)+(r.quantity?' · SL '+esc(r.quantity):'')+' <span class="hint">· '+esc(st.label)+'</span></li>'; }).join("")+'</ul>'
        : '<div class="hint">Chưa có thiết bị nào được nhập cho khoa này.</div>';
      html += '</details>';

      if(HDNB_DEPTS.indexOf(d.code)!==-1){
        var hdnb = state.hdnbMeetings.filter(function(r){ return r.department===d.code; }).sort(function(a,b){ return (b.meetingDate||"").localeCompare(a.meetingDate||""); });
        var hdnbLabel = d.code==="pdd" ? "Họp Hội đồng người bệnh cấp viện" : "Họp Hội đồng người bệnh";
