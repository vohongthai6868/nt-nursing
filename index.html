        html += '<div style="margin:6px 0"><button class="btn" data-action="open-add-hdnb" data-dept="'+esc(d.code)+'" '+(state.dbAvailable?"":"disabled")+'>'+ICONS.plus+'Ghi nhận buổi họp</button></div>';
        html += hdnb.length
          ? '<ul>'+hdnb.map(function(r){ return '<li>'+esc(r.meetingDate||"")+(r.attendeeCount?' · '+esc(r.attendeeCount)+' người dự':'')+(r.topics?' <span class="hint">· '+esc(r.topics)+'</span>':'')+'</li>'; }).join("")+'</ul>'
          : '<div class="hint">Chưa ghi nhận buổi họp nào cho '+(d.code==="pdd"?"cấp viện":"khoa này")+'.</div>';
        html += '</details>';
      }

      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function hdtDetailHtml(r){
    var h = "";
    function list(title, arr){
      if(!(arr||[]).length) return "";
      return '<div style="margin-top:4px;font-weight:600">'+title+'</div><ol style="margin:2px 0 4px;padding-left:20px">'+
        arr.map(function(x){ return '<li style="white-space:normal">'+esc(x.text)+(x.department?' <span class="hint">('+esc(deptName(x.department))+')</span>':'')+
          (x.group?' <span class="tag muted">'+esc(x.group)+'</span>':'')+'</li>'; }).join("")+'</ol>';
    }

  function incidentTransition(id,to){
    if(!db) return;
    var i = findIncident(id);
    if(!i) return;
    var history = (i.history||[]).slice();
    var label = to==="dang_xu_ly" ? "Bắt đầu xử lý" : (to==="da_dong" ? "Đóng sự cố" : "Cập nhật trạng thái");
    history.push({at:nowIso(),action:label,by:meLabel()});
    db.collection("incidents").doc(id).update({status:to,history:history}).then(function(){
      showToast("Đã cập nhật "+i.code);
      state.modal=null; render();
    }).catch(function(e){ showToast("Lỗi: "+(e&&e.message||e),true); });
  }

  /* Ghi nhận một bước: báo cáo bắt buộc (escalation) hoặc phản hồi, phổ biến (followup) */
  function incidentEscalate(id,stepKey,field,na){
    if(!db) return;
    field = field==="followup" ? "followup" : "escalation";
    var i = findIncident(id);
    var step = (field==="followup"?FOLLOWUP_STEPS:ESCALATION_STEPS).filter(function(s){ return s.key===stepKey; })[0];
    if(!i || !step) return;
    var esc2 = Object.assign({}, i[field]||{});
    esc2[stepKey] = na ? {at:nowIso(), by:meLabel(), na:true} : {at:nowIso(), by:meLabel()};
    var history = (i.history||[]).slice();
    history.push({at:nowIso(),action:(na?"Không áp dụng: ":"")+step.label,by:meLabel()});
    var patch = {history:history}; patch[field] = esc2;
    db.collection("incidents").doc(id).update(patch).then(function(){
      Object.assign(i, patch);
      showToast("Đã ghi nhận: "+step.label);
      forceModal = true; render();
    }).catch(function(e){ showToast("Lỗi: "+(e&&e.message||e),true); });
  }

  function incidentFollowupHtml(i, canEdit){
    var ex = i.expertReview||{}, due = incExpertDue(i);
    var plan = i.actionPlan||[];
    var today = localDateStr(new Date());
    var html = '<fieldset><legend>Phân tích, khắc phục và phản hồi</legend>';
    /* Nhóm chuyên gia: 60 ngày */
    html += '<div style="font-weight:700;font-size:12.3px;margin-bottom:4px">Nhóm chuyên gia phân tích nguyên nhân gốc</div>';
    if(ex.doneAt){
      html += '<div class="alertrow"><span class="tag ok">Đã đề xuất</span><span>Nhận báo cáo phân tích '+fmtDate(ex.receivedAt)+', hoàn thành đề xuất giải pháp, khuyến cáo '+fmtDate(ex.doneAt)+'</span></div>';
    } else if(ex.receivedAt){
      var left = daysBetween(today, due);
      html += '<div class="alertrow" style="flex-wrap:wrap"><span class="tag '+(left<0?"danger":(left<=14?"warn":"info"))+'">'+(left<0?"Quá hạn "+(-left)+" ngày":"Còn "+left+" ngày")+'</span><span style="flex:1;min-width:160px">Nhận báo cáo phân tích '+fmtDate(ex.receivedAt)+'; hạn hoàn thành đề xuất giải pháp '+fmtDate(due)+' ('+EXPERT_DAYS+' ngày)</span>'+
        (canEdit&&state.dbAvailable?'<button class="btn sm" data-action="incident-expert-done" data-id="'+esc(i.id)+'">Đã hoàn thành đề xuất</button>':'')+'</div>';

      html += '<div class="hint">Chưa chuyển nhóm chuyên gia. Áp dụng cho sự cố cần phân tích; nhóm chuyên gia hoàn thành đề xuất trong '+EXPERT_DAYS+' ngày kể từ ngày nhận báo cáo phân tích của bộ phận đầu mối.</div>';

    if(plan.length){
      plan.forEach(function(a,idx){

        html += '<div class="alertrow" style="flex-wrap:wrap"><span class="tag '+(a.doneAt?"ok":(late?"danger":"warn"))+'">'+(a.doneAt?"Hoàn thành":(late?"Quá hạn":"Đang làm"))+'</span>'+
          '<span style="flex:1;min-width:160px"><b>'+esc(a.content)+'</b><div class="hint">Phụ trách: '+esc(a.owner||"—")+' · Hạn: '+fmtDate(a.due)+(a.indicator?' · Chỉ số theo dõi: '+esc(a.indicator):'')+(a.doneAt?' · Xong '+fmtDate(a.doneAt):'')+'</div></span>'+
          (!a.doneAt&&canEdit&&state.dbAvailable?'<button class="btn sm" data-action="incident-plan-done" data-id="'+esc(i.id)+'" data-idx="'+idx+'">Hoàn thành</button>':'')+'</div>';
      });

      html += '<div class="hint">Chưa có kế hoạch khắc phục. Mỗi giải pháp cần có nội dung, người chịu trách nhiệm, thời hạn và chỉ số theo dõi.</div>';

    if(canEdit&&state.dbAvailable){
      html += '<div class="fieldrow" style="margin-top:8px"><div class="field"><label>Nội dung giải pháp</label><input type="text" id="f-incp-content"/></div><div class="field"><label>Người chịu trách nhiệm</label><input type="text" id="f-incp-owner" placeholder="Chức danh/khoa phòng"/></div></div>'+
        '<div class="fieldrow"><div class="field"><label>Thời hạn</label><input type="date" id="f-incp-due"/></div><div class="field"><label>Chỉ số theo dõi</label><input type="text" id="f-incp-ind" placeholder="VD: Tỷ lệ tuân thủ 5 đúng ≥ 95%"/></div></div>'+
        '<div style="margin-top:6px"><button class="btn sm" data-action="incident-plan-add" data-id="'+esc(i.id)+'">'+ICONS.plus+'Thêm giải pháp</button></div>';

    var f = i.followup||{};
    html += '<div style="font-weight:700;font-size:12.3px;margin:12px 0 4px">Phản hồi và phổ biến bài học</div>';

  function incidentExpertDone(id){
    var i = findIncident(id);
    if(!db || !i || state.me.canEdit!==true) return;
    incidentUpdate(i, {expertReview:Object.assign({}, i.expertReview||{}, {doneAt:localDateStr(new Date())})}, "Nhóm chuyên gia hoàn thành đề xuất giải pháp, khuyến cáo", "Đã ghi nhận hoàn thành đề xuất");
  }
  function incidentPlanAdd(id){
    var i = findIncident(id);
    if(!db || !i || state.me.canEdit!==true) return;
    var a = {content:document.getElementById("f-incp-content").value.trim(), owner:document.getElementById("f-incp-owner").value.trim(),
      due:document.getElementById("f-incp-due").value||null, indicator:document.getElementById("f-incp-ind").value.trim(), doneAt:null};
    if(!a.content || !a.owner || !a.due){ showToast("Cần nhập nội dung, người chịu trách nhiệm và thời hạn",true); return; }
    incidentUpdate(i, {actionPlan:(i.actionPlan||[]).concat([a])}, "Thêm giải pháp khắc phục: "+a.content, "Đã thêm giải pháp khắc phục");

  function incidentPlanDone(id, idx){
    var i = findIncident(id);
    if(!db || !i || state.me.canEdit!==true) return;
    var plan = (i.actionPlan||[]).map(function(a,k){ return k===idx ? Object.assign({},a,{doneAt:localDateStr(new Date())}) : a; });
    if(!plan[idx]) return;
    incidentUpdate(i, {actionPlan:plan}, "Hoàn thành giải pháp: "+plan[idx].content, "Đã cập nhật kế hoạch khắc phục");
  }

  function incidentReclassify(id){
    if(!db || state.me.canEdit!==true) return;
    var i = findIncident(id);
    if(!i) return;
    var type = document.getElementById("f-incx-type").value;
    var sev = document.getElementById("f-incx-sev").value;
    if(sev==="nghiem_trong" && type!=="bat_buoc"){ showToast("Sự cố tổn thương nặng (NC3) phải là báo cáo bắt buộc",true); return; }
    if(i.mandatoryItem && type!=="bat_buoc"){ showToast("Sự cố thuộc danh mục Phụ lục II phải là báo cáo bắt buộc",true); return; }
    var group = document.getElementById("f-incx-group").value || null;
    var causes = [].map.call(document.querySelectorAll('input[name="f-incx-cause"]:checked'), function(x){ return x.value; });
    var orgImpact = [].map.call(document.querySelectorAll('input[name="f-incx-org"]:checked'), function(x){ return x.value; });
    var history = (i.history||[]).slice();
    var g = catLookup(INCIDENT_GROUPS, group);
    history.push({at:nowIso(),action:"Phân loại: "+REPORT_TYPE[type].label+", "+SEVERITY[sev].label+(g?", nhóm "+g.label:"")+(causes.length?", nguyên nhân "+causes.join(", "):""),by:meLabel()});
    var patch = {reportType:type,severity:sev,incidentGroup:group,causes:causes,orgImpact:orgImpact,history:history};
    if(type==="bat_buoc" && i.anonymous){ patch.anonymous = false; }
    db.collection("incidents").doc(id).update(patch).then(function(){
      Object.assign(i, patch);
      showToast("Đã lưu phân loại "+i.code);
      forceModal = true; render();
    }).catch(function(e){ showToast("Lỗi: "+(e&&e.message||e),true); });
  }

  function saveIncident(){
    if(!db) return;
    var title = document.getElementById("f-inc-title").value.trim();
    var dept = document.getElementById("f-inc-dept").value;
    var sev = document.getElementById("f-inc-sev").value;
    var desc = document.getElementById("f-inc-desc").value.trim();
    var mand = document.getElementById("f-inc-mand").value || null;
    var typeEl = document.querySelector('input[name="f-inc-type"]:checked');
    var type = typeEl ? typeEl.value : "tu_nguyen";
    if(sev==="nghiem_trong" || mand) type = "bat_buoc";
    var anon = type==="tu_nguyen" && document.getElementById("f-inc-anon").checked;
    var whenVal = document.getElementById("f-inc-when").value;
    if(!title){ showToast("Vui lòng nhập tiêu đề sự cố",true); return; }
    var code = "SC-"+new Date().getFullYear()+"-"+String(state.incidents.length+1).padStart(3,"0")+"-"+Math.floor(Math.random()*90+10);
    var by = anon ? "Ẩn danh" : meLabel();
    db.collection("incidents").add({
      code:code,title:title,department:dept,severity:sev,status:"moi",
      reportType:type, mandatoryItem:mand, anonymous:anon,
      incidentGroup: document.getElementById("f-inc-group").value || null, causes:[], orgImpact:[],
      occurredAt: whenVal ? new Date(whenVal).toISOString() : null,
      target: document.getElementById("f-inc-target").value,
      immediateAction: document.getElementById("f-inc-action").value.trim(),
      escalation: {}, relatedAdr: document.getElementById("f-inc-adr").checked,
      reportedBy:by,reportedAt:nowIso(),description:desc,rootCause:"",correctiveActions:[],
      history:[{at:nowIso(),action:"Gửi "+REPORT_TYPE[type].label.toLowerCase(),by:by}]
    }).then(function(){
      showToast(type==="bat_buoc" ? "Đã gửi báo cáo bắt buộc — hãy báo ngay cho lãnh đạo khoa và Phòng QLCL" : "Đã gửi báo cáo sự cố tự nguyện");
      state.modal=null; render();
    }).catch(function(e){ showToast("Lỗi: "+(e&&e.message||e),true); });
  }

  var lastModalKey = null, forceModal = false;
  function renderModal(){
    var el = document.getElementById("modal-root");
    if(!state.modal){ el.innerHTML=""; lastModalKey=null; return; }
    var m = state.modal;
    var key = JSON.stringify(m);
    /* Không dựng lại form đang mở khi có dữ liệu realtime từ người khác (tránh mất nội dung đang nhập) */
    if(key===lastModalKey && !forceModal && el.querySelector("input,select,textarea")) return;
    lastModalKey = key; forceModal = false;
    var html = "";
    if(m.type==="add-staff") html = addStaffModalHtml(m.dept);
    else if(m.type==="add-sop") html = addSopModalHtml(m.dept,m.category);
    else if(m.type==="sop") html = sopModalHtml(m.id);
    else if(m.type==="checklist") html = checklistModalHtml(m.id,m.dept,m.content);
    else if(m.type==="add-incident") html = addIncidentModalHtml(m.dept);
    else if(m.type==="incident") html = incidentModalHtml(m.id);
    else if(m.type==="soyte-summary") html = soyteSummaryModalHtml(m.id);
    else if(m.type==="training") html = trainingModalHtml(m.id);
    else if(m.type==="plan") html = planModalHtml(m.id);
    else if(m.type==="add-legal") html = addLegalDocModalHtml(m.docType,m.docScope);
    else if(m.type==="identity") html = identityModalHtml();
    else if(m.type==="sdb") html = sdbModalHtml(m.id);
    else if(m.type==="add-sdb") html = addSdbModalHtml(m.dept);
    else if(m.type==="add-qr") html = addQualityResultModalHtml();
    else if(m.type==="add-equip") html = addEquipmentModalHtml(m.dept);
    else if(m.type==="add-hdnb") html = addHdnbModalHtml(m.dept);
    else if(m.type==="add-hdt") html = addHdtModalHtml();
    else if(m.type==="add-hddd") html = addHdddModalHtml();

  document.addEventListener("click",function(e){
    var t = e.target.closest("[data-action]");
    if(!t) return;
    var action = t.getAttribute("data-action");
    if(action==="tab"){ state.activeTab = t.getAttribute("data-tab"); state.modal=null; render(); window.scrollTo(0,0); return; }
    if(action==="toggle-theme"){ cycleTheme(); return; }
    if(action==="toggle-alertgroup"){
      var atn = t.getAttribute("data-group");
      var acol = loadAlertCollapsed();
      acol[atn] = !(acol[atn]!==false);
      saveAlertCollapsed(acol);
      render();
      return;
    }
    if(action==="toggle-navgroup"){
      var gi = t.getAttribute("data-group");
      var collapsed = loadNavCollapsed();
      collapsed[gi] = !collapsed[gi];
      saveNavCollapsed(collapsed);
      renderNav();
      return;
    }
    if(action==="goto-alert"){
      state.activeTab = t.getAttribute("data-tab");
      var sDept = t.getAttribute("data-staff-dept");
      if(sDept){ state.filters.staff.dept = sDept; state.filters.staff.competency = "all"; }

      var ldGroupKey = t.getAttribute("data-group-key");
      var ldTab = t.getAttribute("data-tab");
      if(ldGroupKey){
        var ac = loadAlertCollapsed();
        ac[ldGroupKey] = false;
        saveAlertCollapsed(ac);

      state.activeTab = ldTab;
      state.modal = null;
      render();
      setTimeout(function(){
        var el = document.getElementById("legaldoc-"+ldId);

  document.addEventListener("change",function(e){

    if(t.getAttribute && t.getAttribute("data-inc-recalc")){ incFormRecalc(); return; }
    if(t.classList && t.classList.contains("d24-skip")){
      var grp = document.querySelector('[data-d24grp="'+t.getAttribute("data-k")+'"]');
      if(grp){
        grp.style.display = t.checked ? "none" : "flex";
        grp.querySelectorAll('input[type=radio][value="'+(t.checked?"na":"dat")+'"]').forEach(function(r){ r.checked = true; });
      }
      return;
    }
    if(t.id==="f-ck-content" && state.modal && state.modal.type==="checklist"){
      var ckDeptEl = document.getElementById("f-ck-dept");
      if(ckDeptEl) state.modal.dept = ckDeptEl.value;
      state.modal.content = t.value; forceModal = true; renderModal(); return;
    }
    if(t.classList && t.classList.contains("tcbk-note")){ tcbkSave(t.getAttribute("data-code"), t.getAttribute("data-n"), {note:t.value.trim()}); return; }
    if(t.id==="f-qr-name"){
      var tg = document.getElementById("f-qr-target");
      state.plans.forEach(function(p){ (p.kpis||[]).forEach(function(k){ if(t.value===k.code+" — "+k.name && tg && !tg.value) tg.value = k.target||""; }); });
      return;
    }
    var f = t.getAttribute && t.getAttribute("data-filter");
    if(!f) return;
    if(f==="staffDept") state.filters.staff.dept = t.value;
    else if(f==="staffComp") state.filters.staff.competency = t.value;
    else if(f==="sopDept") state.filters.sops.dept = t.value;
    else if(f==="sopStatus") state.filters.sops.status = t.value;
    else if(f==="sodibuongDept") state.filters.sodibuongDept = t.value;
    else if(f==="vbYear") state.filters.vbYear = t.value;
    else if(f==="incType") state.filters.incType = t.value;
    else if(f==="incGroup") state.filters.incGroup = t.value;
    else if(f==="d24Dept") state.filters.d24Dept = t.value;
    else if(f==="d24Content") state.filters.d24Content = t.value;
    else if(f==="tcbkCode") state.filters.tcbkCode = t.value;
    else if(f==="soltYear") state.filters.soltYear = t.value;
    else if(f==="soltQ") state.filters.soltQ = t.value;
    else return;
    render();
  });

  function bumpVersion(v){
    var n = parseFloat(v);
    if(isNaN(n)) return "1.0";
    if(n < 1) return "1.0";
    return (Math.floor(n)+1).toFixed(1);
  }
  function addYears(n){
    var d = new Date();
    d.setFullYear(d.getFullYear()+n);
    return localDateStr(d);
  }

  /* ---------------------------------------------------------------- */
  /* DATA SUBSCRIPTION                                                  */
  /* ---------------------------------------------------------------- */

  function subscribeCollection(name,key){
    db.collection(name).onSnapshot(function(snap){
      /* Bản ghi đã lưu trữ (archived) không hiện trong danh sách, cảnh báo, tổng hợp; dữ liệu vẫn giữ trong db */
      state[key] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }).filter(function(x){ return x.archived!==true; });
      state.loaded[key] = true;
      scheduleRender();
    }, function(err){
      console.error("subscribe "+name,err);
      state.loaded[key] = true;
      scheduleRender();
    });
  }

  /* ---------------------------------------------------------------- */
  /* INIT                                                               */
  /* ---------------------------------------------------------------- */

  function init(){
    render();
    var dbP = (window.claude && window.claude.use) ? window.claude.use("db") : Promise.resolve(null);
    var userP = (window.claude && window.claude.use) ? window.claude.use("user") : Promise.resolve(null);

    dbP.then(function(d){
      db = d;
      state.dbAvailable = !!d;
      if(d){
        subscribeCollection("departments","departments");
        subscribeCollection("staff","staff");
        subscribeCollection("sops","sops");
        subscribeCollection("checklists","checklists");
        subscribeCollection("incidents","incidents");
        subscribeCollection("plans","plans");
        subscribeCollection("legal_docs","legalDocs");
        subscribeCollection("trainings","trainings");
        subscribeCollection("sodibuong","sodibuong");
        subscribeCollection("quality_results","qualityResults");
        subscribeCollection("equipment","equipment");
        subscribeCollection("hdnb_meetings","hdnbMeetings");
        subscribeCollection("hdt_meetings","hdtMeetings");
        subscribeCollection("hddd_meetings","hdddMeetings");
        subscribeCollection("incident_stats","incidentStats");
        subscribeCollection("khac_docs","khac");
        subscribeCollection("related_units","lienquandv");
        subscribeCollection("giaoban_reports","giaoban");
        subscribeCollection("bao_cao_truc","baoCaoTruc");
        subscribeCollection("de_nghi","deNghi");
        subscribeCollection("so_luu_tru","soLuuTru");
        subscribeCollection("soyte_reports","soyteReports");
        subscribeCollection("tieuchi_tudanhgia","tieuchiAssess");
      } else {
        Object.keys(state.loaded).forEach(function(k){ state.loaded[k]=true; });
      }
      scheduleRender();
      loadMyProfile();
    }).catch(function(){ state.dbAvailable=false; scheduleRender(); });

    userP.then(function(u){
      userCap = u;
      if(!u) return;
      return u.me().then(function(me){
        state.me.id = me.id;
        state.me.name = me.name || "";
        state.me.avatarUrl = me.avatarUrl || "";
        state.me.isOwner = !!me.isOwner;
        state.me.canEdit = !!me.canEdit;
        scheduleRender();
        loadMyProfile();
      });
    }).catch(function(){});
  }

  function loadMyProfile(){
    if(!db || !state.me.id) return;
    db.doc("data/users/"+state.me.id+"/profile").get().then(function(snap){
      if(snap.exists){
        var data = snap.data();
        state.myProfile.staffId = data.staffId || null;
        state.myProfile.department = data.department || null;
        scheduleRender();
      }
    }).catch(function(){});
  }

  function identityModalHtml(){
    var body = '<div class="hint">Chọn tên của anh/chị trong danh sách nhân sự để hệ thống tự điền khi ghi nhận checklist, sự cố... Thông tin này chỉ lưu riêng cho tài khoản của anh/chị.</div>';
    body += '<div class="field"><label>Tôi là</label><select id="f-identity-staff"><option value="">— Chưa chọn —</option>'+
      state.staff.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(s){
        return '<option value="'+esc(s.id)+'" data-dept="'+esc(s.department)+'"'+(state.myProfile.staffId===s.id?" selected":"")+'>'+esc(s.name)+' · '+esc(deptName(s.department))+'</option>';
      }).join("")+
      '</select></div>';
    body += '<div class="hint">Lưu ý: đây là tự khai báo để cá nhân hóa giao diện, không phải cơ chế xác thực bảo mật. Quyền phê duyệt SOP/đóng sự cố do Phòng Điều dưỡng cấp cho từng tài khoản (Được sửa / Chỉ xem).</div>';
    return modalWrap("Nhận diện danh tính", body,
      '<button class="btn" data-action="close-modal">Đóng</button>'+
      '<button class="btn primary" data-action="save-identity" '+(state.dbAvailable&&state.me.id?"":"disabled")+'>Lưu</button>');
  }

  function saveIdentity(){
    if(!db || !state.me.id) return;
    var sel = document.getElementById("f-identity-staff");
    var staffId = sel.value;
    var dept = staffId ? sel.options[sel.selectedIndex].getAttribute("data-dept") : null;
    db.doc("data/users/"+state.me.id+"/profile").set({staffId:staffId||null, department:dept, updatedAt:nowIso()}).then(function(){
      state.myProfile.staffId = staffId||null;
      state.myProfile.department = dept;
      showToast("Đã lưu danh tính");
      state.modal=null; render();
    }).catch(function(e){ showToast("Lỗi: "+(e&&e.message||e),true); });
  }

  document.addEventListener("keydown", function(e){
    if((e.key==="Enter"||e.key===" ") && e.target.getAttribute && e.target.getAttribute("role")==="button" && e.target.getAttribute("data-action")){ e.preventDefault(); e.target.click(); }
  });
  window.addEventListener("resize", function(){
    var h = document.getElementById("topbar");
    if(h) document.documentElement.style.setProperty("--hdr-h", h.offsetHeight+"px");
  });
  init();
})();
</script>



</body></html>
